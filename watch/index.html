<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch & think · ¡A jugar!</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/games.css">
<link rel="icon" href="../img/pj/pera_icon.webp">
<style>
  .sv{display:block;font-family:'Nunito',sans-serif;font-size:.62em;color:var(--soft);font-weight:800;margin-top:2px;letter-spacing:0;text-shadow:none}
  .label .sv{display:inline;margin-left:8px;font-size:14px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
  .vcard{background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;color:var(--ink);font-family:'Nunito',sans-serif}
  .vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:3px solid var(--ink);display:block;background:#ddd}
  .vcard .vt{font-weight:900;font-size:18px;padding:8px 10px 2px;line-height:1.2}
  .vcard .vm{font-weight:800;font-size:14px;color:var(--soft);padding:0 10px 10px}
  .vcard.seen .vt::before{content:"✔ ";color:var(--green)}
  .tag{display:inline-block;background:var(--cyan);border:2px solid var(--ink);border-radius:10px;padding:0 6px;font-size:12px;font-weight:900;color:var(--ink);margin-left:4px}
  .tag.t{background:var(--pink);color:#fff}
  .player{position:relative;width:100%;aspect-ratio:16/9;border:var(--bd);border-radius:18px;overflow:hidden;background:#000;box-shadow:var(--sh)}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .q{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:900;font-size:20px}
  .q .sv{font-size:15px}
  .q textarea,.panel textarea,.panel input[type=text]{width:100%;box-sizing:border-box;margin-top:8px;border:3px solid var(--ink);border-radius:12px;padding:8px;font:800 17px 'Nunito',sans-serif;resize:vertical}
  .q .told{margin-top:8px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:900;font-size:15px}
  .q .told.on{background:var(--lime)}
  .steps{display:flex;gap:6px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
  .steps span{border:3px solid var(--ink);border-radius:12px;padding:2px 10px;font-weight:900;background:#fff;font-size:15px}
  .steps span.on{background:var(--yellow)}
  .rate button{font-size:34px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 12px;margin:4px}
  .rate button.on{background:var(--yellow)}
  .note{font-weight:800;color:var(--soft);font-size:15px}
  .row2{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:2px dashed #ddd;font-size:17px;flex-wrap:wrap}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="videos.js"></script>
<script>
VIDEOS.forEach(v=>{ const d=DEFAULT_Q[v.cat]||DEFAULT_Q.fun; if(!CATS[v.cat]) v.cat="fun"; v.pre=v.pre||d.pre; v.think=v.think||d.think; });
const LIVE=()=>VIDEOS.filter(v=>!v.hidden);
const isNew=v=>v.added && (Date.now()-new Date(v.added).getTime()) < 14*864e5;
const KEY="aJugar-watch";
let S={log:{},recs:[]};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) S=Object.assign(S,s); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
const app=document.getElementById("app");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const today=()=>new Date().toISOString().slice(0,10);
const V=id=>VIDEOS.find(v=>v.id===id);
const thumb=id=>`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
let picks=null, cat=null;

function card(v){
  return `<button class="vcard ${S.log[v.id]?"seen":""}" data-v="${v.id}"><img src="${thumb(v.id)}" alt="" loading="lazy">
    <span class="vt">${esc(v.t)}</span><span class="vm">${esc(v.ch)}${v.min?" · "+v.min:""}${isNew(v)?'<span class="tag" style="background:var(--yellow)">NEW</span>':""}${v.long?'<span class="tag">2 parts</span>':""}${v.teacher?'<span class="tag t">with teacher</span>':""}</span></button>`;
}
function home(){
  if(!picks){ const ok=LIVE().filter(v=>!v.teacher), un=ok.filter(v=>!S.log[v.id]);
    const fresh=shuffle(un.filter(isNew)), rest=shuffle(un.filter(v=>!isNew(v))), seen=shuffle(ok.filter(v=>S.log[v.id]));
    picks=[...fresh,...rest,...seen].slice(0,3).map(v=>v.id); }
  const allSeen=LIVE().every(v=>S.log[v.id]);
  const n=Object.keys(S.log).length;
  app.innerHTML=`
  <a class="home" href="../english-basics/">🍐 English Fun</a>
  <header><h1 class="outline"><span class="w3">Watch</span> <span class="w1">& think</span></h1>
    <div class="stars">🎬 <span>${n}</span></div></header>
  <div class="fresca-row"><img class="fresca" src="../img/pj/pera.webp" alt="Pera"><div class="bubble">${allSeen?`Wow, you watched them all! 🏆 Ask your teacher for new videos.<span class="sv">Du har sett alla! Fråga din lärare efter nya videor.</span>`:`Pick one video. Watch it, then think!<span class="sv">Välj en video. Titta och tänk sen!</span>`}</div></div>
  <div class="panel"><p class="label">⭐ Today's picks <span class="sv">Dagens förslag</span></p>
    <div class="vgrid">${picks.map(id=>card(V(id))).join("")}</div>
    <div class="opts" style="justify-content:flex-start;margin-top:12px"><button class="next" id="other" style="background:var(--cyan)">🔀 Other 3 / Tre andra</button></div></div>
  <div class="panel"><p class="label">📚 All videos <span class="sv">Alla videor</span></p>
    <div class="cats">${Object.entries(CATS).filter(([k])=>LIVE().some(v=>v.cat===k)).map(([k,n])=>`<button class="topic ${k===cat?"on":""}" data-c="${k}">${n}</button>`).join("")}</div>
    ${cat?`<div class="vgrid">${LIVE().filter(v=>v.cat===cat).map(card).join("")}</div>`:`<p class="note">Choose a group. / Välj en grupp.</p>`}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">
    <button class="act" id="rec" style="background:var(--pink)"><span class="ico">🙋</span><span>Recommend me a video<span class="sv">Tipsa mig om en video</span></span></button>
    <button class="act" id="tch" style="background:var(--lime)"><span class="ico">📒</span><span>For my teacher<span class="sv">Till min lärare</span></span></button>
  </div>`;
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>before(b.dataset.v));
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ cat=cat===b.dataset.c?null:b.dataset.c; home(); });
  document.getElementById("other").onclick=()=>{ const rest=LIVE().filter(v=>!picks.includes(v.id)&&!v.teacher); picks=shuffle(rest).slice(0,3).map(v=>v.id); home(); };
  document.getElementById("rec").onclick=recommend;
  document.getElementById("tch").onclick=teacher;
  scrollTo(0,0);
}
let cur=null;
function steps(i){ return `<div class="steps">${["1 Guess","2 Watch","3 Think"].map((s,k)=>`<span class="${k===i?"on":""}">${s}</span>`).join("")}</div>`; }
function before(id){
  const v=V(id); cur={id, guess:"", ans:["","",""], told:[false,false,false], cc:true, stars:0, word:""};
  app.innerHTML=`<a class="home" href="#" id="back">⬅ Videos</a>${steps(0)}
  <div class="panel"><p class="label">🎬 ${esc(v.t)} <span class="sv">${esc(v.ch)}${v.min?" · "+v.min:""}</span></p>
    <img src="${thumb(id)}" alt="" style="width:100%;max-width:520px;border:var(--bd);border-radius:16px;display:block;margin:0 auto 8px">
    ${v.teacher?`<p class="note">🙋 Watch this one together with your teacher. / Titta på den här tillsammans med din lärare.</p>`:""}
    <div class="q">🤔 ${v.pre[0]}<span class="sv">${v.pre[1]}</span>
      <textarea id="guess" rows="2" placeholder="My guess… (English or svenska)"></textarea></div>
    <p class="note">You can also just think, or tell your teacher. / Du kan också bara tänka, eller berätta för din lärare.</p>
    <div class="opts"><button class="next" id="go" style="background:var(--pink);color:#fff">▶ Watch / Titta</button></div></div>`;
  document.getElementById("back").onclick=e=>{e.preventDefault();home();};
  document.getElementById("go").onclick=()=>{ cur.guess=document.getElementById("guess").value.trim(); watch(); };
  scrollTo(0,0);
}
function watch(){
  const v=V(cur.id);
  const src=()=>`https://www.youtube-nocookie.com/embed/${v.id}?rel=0&cc_lang_pref=en&hl=en${cur.cc?"&cc_load_policy=1":""}`;
  app.innerHTML=`<a class="home" href="#" id="back">⬅ Videos</a>${steps(1)}
  <div class="panel"><p class="label">🎬 ${esc(v.t)}</p>
    <div class="player"><iframe id="yt" src="${src()}" title="${esc(v.t)}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    ${v.long?`<p class="note">⏸ This video is long. Watch half, take a break, then watch the rest. / Lång video: titta på halva, ta en paus, titta sen klart.</p>`:""}
    <div class="opts" style="margin-top:10px">
      <button class="next" id="cc" style="background:#fff">💬 Subtitles ${cur.cc?"ON":"OFF"}</button>
      <a class="next" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" style="background:#fff;text-decoration:none;color:var(--ink)">↗ YouTube</a>
      <button class="next" id="done" style="background:var(--lime)">✔ I watched it / Klar</button></div></div>`;
  document.getElementById("back").onclick=e=>{e.preventDefault();home();};
  document.getElementById("cc").onclick=()=>{ cur.cc=!cur.cc; watch(); };
  document.getElementById("done").onclick=think;
  scrollTo(0,0);
}
function think(){
  const v=V(cur.id);
  app.innerHTML=`<a class="home" href="#" id="back">⬅ Videos</a>${steps(2)}
  <div class="panel"><p class="label">🧠 Think <span class="sv">Tänk</span></p>
    <p class="note">Answer in English or Swedish, write or talk — you choose. There are no wrong answers. / Svara på engelska eller svenska, skriv eller prata – du väljer. Det finns inga fel svar.</p>
    ${cur.guess?`<div class="q" style="background:#fff8d6">🤔 Your guess: <span style="font-weight:800">${esc(cur.guess)}</span><span class="sv">Hade du rätt? / Were you right?</span></div>`:""}
    ${v.think.map((q,i)=>`<div class="q">${i+1}. ${q[0]}<span class="sv">${q[1]}</span>
      <textarea data-a="${i}" rows="2" placeholder="…">${esc(cur.ans[i])}</textarea>
      <button class="told ${cur.told[i]?"on":""}" data-t="${i}">💬 I told my teacher / Jag berättade</button></div>`).join("")}
    <div class="q">📝 One new word I heard <span class="sv">Ett nytt ord jag hörde</span><input type="text" id="word" value="${esc(cur.word)}"></div>
    <div class="q">⭐ Did you like it? <span class="sv">Gillade du den?</span>
      <div class="rate">${[1,2,3].map(n=>`<button data-s="${n}" class="${cur.stars===n?"on":""}">${["😐","🙂","🤩"][n-1]}</button>`).join("")}</div></div>
    <div class="opts"><button class="next" id="fin" style="background:var(--pink);color:#fff">✔ Done / Klar</button></div></div>`;
  const keep=()=>{ app.querySelectorAll("[data-a]").forEach(t=>cur.ans[+t.dataset.a]=t.value.trim()); cur.word=document.getElementById("word").value.trim(); };
  document.getElementById("back").onclick=e=>{e.preventDefault();home();};
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ keep(); cur.told[+b.dataset.t]=!cur.told[+b.dataset.t]; b.classList.toggle("on"); });
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ keep(); cur.stars=+b.dataset.s; app.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x===b)); });
  document.getElementById("fin").onclick=()=>{ keep(); S.log[cur.id]={d:today(),guess:cur.guess,ans:cur.ans,told:cur.told,word:cur.word,stars:cur.stars}; save(); finished(); };
  scrollTo(0,0);
}
function finished(){
  const n=Object.keys(S.log).length;
  app.innerHTML=`<div class="stage end" style="background:var(--lime)"><div style="font-size:90px">🎬</div>
    <h2 class="outline" style="color:#fff">Well done!</h2><div style="font-weight:900;font-size:20px">Bra jobbat! You have watched ${n} video${n===1?"":"s"}.</div>
    <div style="font-weight:900;font-size:18px;margin-top:8px">Show your teacher what you think! · Visa din lärare! 🙋</div>
    <div class="opts" style="margin-top:14px"><button class="next" id="more" style="background:#fff">🎬 Another video / En till</button>
    <a class="next" href="../english-basics/" style="background:var(--yellow);text-decoration:none;color:var(--ink)">🍐 English Fun</a></div></div>`;
  picks=null;
  document.getElementById("more").onclick=home;
}
function recommend(){
  app.innerHTML=`<a class="home" href="#" id="back">⬅ Videos</a>
  <div class="panel"><p class="label">🙋 Recommend me a video <span class="sv">Tipsa mig om en video</span></p>
    <div class="fresca-row"><img class="fresca" src="../img/pj/pera.webp" alt="Pera"><div class="bubble">What do you like to watch? Tell me! Maybe I will put it here.<span class="sv">Vad gillar du att titta på? Berätta! Kanske lägger jag in den här.</span></div></div>
    <input type="text" id="rt" placeholder="Title, channel or link / Titel, kanal eller länk">
    <textarea id="rw" rows="2" placeholder="Why is it good? (optional) / Varför är den bra? (frivilligt)"></textarea>
    <div class="opts"><button class="next" id="rs" style="background:var(--pink);color:#fff">💾 Save / Spara</button></div>
    ${S.recs.length?`<p class="label" style="margin-top:14px">My tips <span class="sv">Mina tips</span></p>${S.recs.map(r=>`<div class="row2"><b>${esc(r.t)}</b><span>${esc(r.w)}</span></div>`).join("")}`:""}
    <p class="note" style="margin-top:10px">🔒 Saved only on this computer. Show it to your teacher. / Sparas bara på den här datorn.</p></div>`;
  document.getElementById("back").onclick=e=>{e.preventDefault();home();};
  document.getElementById("rs").onclick=()=>{ const t=document.getElementById("rt").value.trim(); if(!t) return; S.recs.push({t,w:document.getElementById("rw").value.trim(),d:today()}); save(); recommend(); };
}
function teacher(){
  const ids=Object.keys(S.log);
  app.innerHTML=`<a class="home" href="#" id="back">⬅ Videos</a>
  <div class="panel"><p class="label">📒 For my teacher <span class="sv">Till min lärare</span></p>
    ${ids.length?ids.map(id=>{ const v=V(id), l=S.log[id]; if(!v) return ""; return `<div class="q" style="font-size:17px">🎬 ${esc(v.t)} <span class="sv">${l.d} · ${["","😐","🙂","🤩"][l.stars||0]} ${l.word?"· 📝 "+esc(l.word):""}</span>
      ${l.guess?`<div class="note">🤔 ${esc(l.guess)}</div>`:""}
      ${v.think.map((q,i)=>(l.ans[i]||l.told[i])?`<div class="row2"><span>${i+1}. ${q[0]}</span><b>${l.told[i]?"💬 ":""}${esc(l.ans[i])}</b></div>`:"").join("")}</div>`; }).join("")
      :`<p class="note">No videos yet. / Inga videor än.</p>`}
    ${S.recs.length?`<p class="label" style="margin-top:14px">🙋 Tips <span class="sv">Tips från mig</span></p>${S.recs.map(r=>`<div class="row2"><b>${esc(r.t)}</b><span>${esc(r.w)}</span></div>`).join("")}`:""}
    <p class="note" style="margin-top:10px">🔒 Saved only on this computer. / Sparas bara på den här datorn.</p></div>`;
  document.getElementById("back").onclick=e=>{e.preventDefault();home();};
}
home();
</script>
</body>
</html>
