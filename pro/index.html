<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Misión Pro · ¡A jugar!</title>
<link rel="stylesheet" href="../engine/games.css">
<!--
  Hola, hacker 👋
  Las respuestas no están aquí. Solo hay huellas (SHA-256) y una huella no se puede leer al revés.
  El camino más corto es el español. ¡Suerte!
-->
<style>
  body{background:#141414;color:#e8ffe8}
  .wrap{max-width:720px;margin:0 auto;padding:18px}
  .term{background:#0b0b0b;border:3px solid #39ff88;border-radius:16px;box-shadow:0 0 0 4px #141414,0 0 24px #39ff8855;padding:18px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .term h1{font-family:'Luckiest Guy',sans-serif;font-weight:400;color:#39ff88;font-size:clamp(28px,7vw,44px);margin:0 0 6px;letter-spacing:1px}
  .term p{line-height:1.5;margin:8px 0}
  .sv{color:#8fbf9f;font-size:.9em;display:block}
  .bar{display:flex;gap:6px;margin:12px 0 16px}
  .bar span{flex:1;height:10px;border-radius:6px;background:#203a2a}
  .bar span.on{background:#39ff88}
  .clue{background:#111d15;border:2px dashed #39ff88;border-radius:12px;padding:14px;margin:12px 0;font-size:1.05em}
  input{width:100%;font:inherit;font-size:1.1em;padding:12px;border-radius:10px;border:2px solid #39ff88;background:#000;color:#39ff88;margin-top:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{font:inherit;font-weight:800;border:none;border-radius:999px;padding:10px 18px;cursor:pointer}
  .ok{background:#39ff88;color:#000}.hint{background:#203a2a;color:#e8ffe8}
  .msg{min-height:1.4em;margin-top:8px;font-weight:700}
  .bad{color:#ff6b9a}.good{color:#39ff88}
  .found{display:inline-block;background:#203a2a;border-radius:8px;padding:2px 10px;margin:2px;color:#39ff88}
  .pro{width:180px;height:180px;margin:12px auto;border-radius:50%;border:5px solid #141414;background:conic-gradient(#ff2fa0,#ffd23f,#39ff88,#2fd0ff,#9b5cff,#ff2fa0);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 0 0 5px #fff,0 0 30px #fff8;animation:spin 6s linear infinite}
  .pro img{width:86px;filter:drop-shadow(2px 2px 0 #141414);animation:spin 6s linear infinite reverse}
  .pro b{font-family:'Luckiest Guy',sans-serif;font-size:34px;color:#fff;text-shadow:2px 2px 0 #141414;margin-top:-6px;animation:spin 6s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.pro,.pro img,.pro b{animation:none}}
  .back{display:inline-block;margin-bottom:12px;color:#39ff88}
  /* diploma (solo al imprimir) */
  .dip{display:none}
  @media print{
    @page{size:A4 landscape;margin:12mm}
    body{background:#fff}.wrap{display:none}
    .dip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:180mm;border:4mm solid #141414;border-radius:10mm;color:#141414;font-family:'Nunito',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .dip h2{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:40pt;margin:4mm 0;color:#ff2fa0;text-shadow:1mm 1mm 0 #141414}
    .dip .pro{animation:none;box-shadow:none;width:60mm;height:60mm}
    .dip .pro *{animation:none}
    .dip p{font-size:15pt;margin:2mm}
  }
</style>
</head>
<body>
<div class="wrap"><a class="back" href="javascript:history.back()">⬅ Volver / Tillbaka</a><div class="term" id="app"></div></div>
<div class="dip" id="dip"></div>
<script>
/* Las respuestas se comprueban por su huella SHA-256: mirar el código no las revela. */
const H={
  1:["52d7fa158651d60459bf30cf"],
  2:["5d1a2652d7e3fb48ec8ce126","755c02f5829020df2ff1cdef"],
  3:["7d45d380d851d662e61e2957","fd628fadf8430e1e1fe39408"],
  4:["f54f2c08ace7c2a19f4e1bb2"]};
const STEPS=[
 {t:"Pista 1 · El animal",
  q:"Tengo cuatro patas y una cola. No soy un gato. Digo «¡guau, guau!». Soy el mejor amigo de las personas. ¿Qué animal soy?",
  h:"Ett djur som skäller. 🐕 Skriv ordet på spanska."},
 {t:"Pista 2 · Lee con atención",
  q:"Sofía tiene una bici nueva. No es azul, no es verde y no es negra. Es del mismo color que un tomate y que una fresa. ¿De qué color es la bici?",
  h:"Läs texten igen: vilken färg har en tomat? 🍅 Svara med en färg på spanska."},
 {t:"Pista 3 · Los números",
  q:"Tengo veinte caramelos. Me como nueve. ¿Cuántos caramelos tengo ahora? Escribe el número en español, con letras.",
  h:"20 − 9 = ? Skriv talet med bokstäver på spanska (diez, once, doce…)."},
 {t:"Pista 4 · La contraseña",
  q:"Mira tus tres respuestas. Une la primera letra de cada una, en orden. Esa es la contraseña final.",
  h:"Ta första bokstaven i svar 1, 2 och 3."}];
const KEY="aJugar-pro";
let S={step:0,ans:[],done:false,nick:""};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY+"-mision")||"{}"));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY+"-mision",JSON.stringify(S)); if(S.done) localStorage.setItem(KEY,JSON.stringify({date:new Date().toISOString().slice(0,10),nick:S.nick}));}catch(e){}};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ ]/g,"").trim().replace(/^(el|la|los|las|un|una|es|son)\s+/,"").replace(/\s+/g,"");
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("aJugar:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24);}
const app=document.getElementById("app");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=()=>`<div class="pro"><img src="../img/pj/fresca_icon.webp" alt=""><b>PRO</b></div>`;
function bar(){return `<div class="bar">${STEPS.map((_,i)=>`<span class="${i<S.step||S.done?"on":""}"></span>`).join("")}</div>`;}
function render(){
  if(S.done) return win();
  if(S.step===0 && !S.started){
    app.innerHTML=`<h1>&gt; MISIÓN PRO_</h1>${bar()}
    <p>Has encontrado la puerta secreta. 🕵️ Muy pocas personas llegan hasta aquí.</p>
    <p>Para conseguir la pegatina <b>PRO</b> tienes que resolver cuatro pistas. Todas están en español.<span class="sv">Lös fyra ledtrådar på spanska för att få det hemliga klistermärket PRO.</span></p>
    <p class="sv">Tips: svaren finns inte i koden. Det snabbaste sättet är spanskan. 😉</p>
    <div class="row"><button class="ok" id="go">Empezar / Starta ▶</button></div>`;
    document.getElementById("go").onclick=()=>{S.started=true;save();render();};
    return;
  }
  const st=STEPS[S.step];
  app.innerHTML=`<h1>&gt; ${esc(st.t)}_</h1>${bar()}
   ${S.ans.length?`<p>${S.ans.map((a,i)=>`<span class="found">${i+1}: ${esc(a)}</span>`).join("")}</p>`:""}
   <div class="clue">${esc(st.q)}</div>
   <input id="a" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta / Ditt svar">
   <div class="row"><button class="ok" id="chk">Comprobar ✓</button><button class="hint" id="hn">💡 Pista</button></div>
   <div class="msg" id="m"></div>`;
  const inp=document.getElementById("a"), m=document.getElementById("m");
  inp.focus();
  const check=async()=>{
    const v=norm(inp.value); if(!v) return;
    const h=await hash(v);
    if(H[S.step+1].includes(h)){
      m.className="msg good"; m.textContent="✔ ¡Correcto! / Rätt!";
      S.ans.push(inp.value.trim()); S.step++;
      if(S.step>=STEPS.length) S.done=true;
      save(); setTimeout(render,700);
    } else { m.className="msg bad"; m.textContent="✖ No es correcto. Inténtalo otra vez. / Försök igen."; inp.select(); }
  };
  document.getElementById("chk").onclick=check;
  inp.onkeydown=e=>{if(e.key==="Enter")check();};
  document.getElementById("hn").onclick=()=>{m.className="msg";m.textContent="💡 "+st.h;};
}
function win(){
  app.innerHTML=`<h1>&gt; ACCESO CONCEDIDO_</h1>${bar()}
   ${badge()}
   <p style="text-align:center"><b>¡Enhorabuena! Eres PRO.</b><span class="sv">Grattis! Du är PRO. Klistermärket finns nu i ditt album.</span></p>
   <p>Escribe tu nombre de jugador para el diploma (se queda solo en este ordenador):</p>
   <input id="nk" maxlength="24" value="${esc(S.nick)}" placeholder="Nombre de jugador">
   <div class="row"><button class="ok" id="pr">🖨️ Imprimir diploma</button></div>
   <div class="clue" style="margin-top:16px">✉️ <b>Último reto:</b> escribe un email a tu profe <b>en español</b> y cuéntale cómo has resuelto la misión. Tres frases son suficientes. Por ejemplo:<br><br>
   «Hola. Soy PRO. 😎 La pista más difícil fue la número… porque… Mi juego favorito de la web es…»
   <span class="sv">Sista utmaningen: skriv ett mejl på spanska till din lärare och berätta hur du löste uppdraget.</span></div>
   <p class="sv">🤫 Avslöja inte svaren för någon. Låt de andra hitta dörren själva!</p>`;
  const nk=document.getElementById("nk");
  nk.oninput=()=>{S.nick=nk.value;save();};
  document.getElementById("pr").onclick=()=>{
    document.getElementById("dip").innerHTML=`${badge()}<h2>¡Misión PRO cumplida!</h2>
     <p><b style="font-size:22pt">${esc(S.nick||"Jugador/a secreto/a")}</b></p>
     <p>ha encontrado la puerta secreta y ha resuelto la misión en español.</p>
     <p>har hittat den hemliga dörren och löst uppdraget på spanska.</p>
     <p style="margin-top:8mm">¡A jugar! · ${new Date().toLocaleDateString("es-ES")} · Firma de la profe: _______________</p>`;
    print();
  };
}
render();
</script>
</body>
</html>
