<style>

  .langs a.on{background:var(--ink);color:#fff}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .room{border:var(--bd);box-shadow:var(--sh);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-height:170px}
  .room .ico{font-size:44px;line-height:1}
  .room b{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:25px;line-height:1.1}
  .room span{font-size:15px;font-weight:800}
  .room .lvl{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:900;align-self:flex-start}
  .room .done{position:absolute;top:-12px;right:10px;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px;transform:rotate(4deg)}
  .timer{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:900;font-size:20px;box-shadow:3px 3px 0 var(--ink)}
  .chests{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .chest{background:var(--lime);border:var(--bd);box-shadow:var(--sh);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
  .chest:nth-child(2){background:var(--pink);color:#fff}.chest:nth-child(3){background:var(--cyan)}.chest:nth-child(4){background:var(--orange)}.chest:nth-child(5){background:var(--purple);color:#fff}
  .chest .big{font-size:48px;line-height:1}
  .chest b{font-size:18px;font-weight:900;text-align:center}
  .chest.solved{background:#fff!important;color:var(--ink)!important}
  .chest .digit{font-family:'Luckiest Guy',sans-serif;font-size:48px;color:var(--pink);text-shadow:3px 3px 0 var(--ink);line-height:1}
  .lock{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
  .lock input{width:58px;height:70px;border:var(--bd);border-radius:14px;font-family:'Luckiest Guy',sans-serif;font-size:40px;text-align:center;box-shadow:3px 3px 0 var(--ink);background:#fff}

  .open{background:var(--pink);color:#fff;border:var(--bd);border-radius:18px;padding:14px 22px;font-size:22px;font-weight:900;box-shadow:4px 4px 0 var(--ink)}
  .table{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;max-width:560px;margin:8px auto 16px;align-items:center;text-align:left}
  .table .pr{font-weight:900;font-size:20px;color:var(--soft);text-align:right}
  .table .row{font-size:26px;font-weight:900;padding:6px 10px;border-radius:12px}
  .table .row.cur{background:var(--lime);outline:3px solid var(--ink)}
  .table .slot{display:inline-block;width:auto;min-width:64px;height:auto;padding:2px 8px;font-size:26px;vertical-align:middle}
  .typed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px}

const END = {ar:["o","as","a","amos","áis","an"], er:["o","es","e","emos","éis","en"], ir:["o","es","e","imos","ís","en"]};
const IRR = {ser:["soy","eres","es","somos","sois","son"], estar:["estoy","estás","está","estamos","estáis","están"],
             tener:["tengo","tienes","tiene","tenemos","tenéis","tienen"], ir:["voy","vas","va","vamos","vais","van"]};
const IRR_GLOSS = {

  sv:{ser:"är",estar:"är",tener:"har",ir:"går"} };
const IRR_INF = {ser:"to be (identity)",estar:"to be (place / mood)",tener:"to have",ir:"to go"};

const PP_IRR = {hacer:"hecho",ver:"visto",escribir:"escrito",abrir:"abierto",volver:"vuelto",decir:"dicho",poner:"puesto",leer:"leído"};
const PP_BAD = {hacer:"hacido",ver:"vido",escribir:"escribido",abrir:"abrido",volver:"volvido",decir:"decido",poner:"ponido",leer:"leyido"};
const GER_IRR = {leer:"leyendo",dormir:"durmiendo",decir:"diciendo"};
const GER_BAD = {leer:"leiendo",dormir:"dormiendo",decir:"deciendo"};
const stem = v => v.slice(0,-2);
const pp  = v => PP_IRR[v] || stem(v) + (V[v].c==="ar" ? "ado" : "ido");
const ppBad = v => PP_BAD[v] || stem(v) + (V[v].c==="ar" ? "ido" : "ado");
const ger = v => GER_IRR[v] || stem(v) + (V[v].c==="ar" ? "ando" : "iendo");
const gerBad = v => GER_BAD[v] || stem(v) + (V[v].c==="ar" ? "iendo" : "ando");

function gloss(room, v, p){
  if(L==="en"){
    const P=["I","you","he/she","we","you all","they"][p], be=["am","are","is","are","are","are"][p], have=p===2?"has":"have";
    if(room.id==="irregulares") return `${P} ${IRR_GLOSS.en[v][p]}`;
    const e=V[v].en;
    if(room.id==="presente") return `${P} ${p===2?e[1]:e[0]}`;
    if(room.id==="futuro") return `${P} ${be} going to ${e[0]}`;
    if(room.id==="perfecto") return `${P} ${have} ${e[3]}`;
    return `${P} ${be} ${e[2]}`;
  } else {
    const P=["jag","du","han/hon","vi","ni","de"][p];
    if(room.id==="irregulares") return `${P} ${IRR_GLOSS.sv[v]}`;
    const s=V[v].sv;
    if(room.id==="presente") return `${P} ${s[0]}`;
    if(room.id==="futuro") return `${P} ska ${s[1]}`;
    if(room.id==="perfecto") return `${P} har ${s[2]}`;
    return `${P} håller på att ${s[1]}`;
  }
}

const noAcc = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");

let voice=null; function pickVoice(){ try{ const v=speechSynthesis.getVoices(); voice=v.find(x=>/es[-_]ES/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function say(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(" .",".")); u.lang="es-ES"; u.rate=.85; if(voice) u.voice=voice; speechSynthesis.speak(u); }catch(e){} }

function startRoom(i){
  R = ROOMS[i];
  S = {i, start:Date.now(), digits:R.puzzles.map(()=>Math.floor(Math.random()*10)), solved:R.puzzles.map(()=>false)};
  clearInterval(tick); tick=setInterval(()=>{ const t=document.getElementById("time"); if(t) t.textContent="⏱️ "+fmt(Math.floor((Date.now()-S.start)/1000)); },1000);
  roomView();
}
const timerHTML = () => `<div class="timer" id="time">⏱️ ${fmt(Math.floor((Date.now()-S.start)/1000))}</div>`;

  <div class="topbar"><button class="back" id="toRooms">${T.rooms}</button><div style="flex:1"></div>${timerHTML()}</div>
  <header><h1 class="outline"><span class="w1">${R.icon} ${R.title}</span><span class="sub">${R.lvl} · ${R.sub[L]}</span></h1></header>
  <div class="fresca-row"><img class="fresca" src="${IMG}fresca.webp" alt="Fresca"><div class="bubble">${T.roomIntro}</div></div>
  <div class="chests">${R.puzzles.map((p,k)=>`<button class="chest ${S.solved[k]?"solved":""}" data-k="${k}">
     ${S.solved[k]?`<span class="digit">${S.digits[k]}</span>`:`<span class="big">🧰</span>`}<b>${k+1}. ${T.names[p]}</b></button>`).join("")}</div>
  <div class="panel" style="margin-top:20px"><p class="label">${T.lock}</p>
   <div class="lock">${R.puzzles.map((p,k)=>`<div><input inputmode="numeric" maxlength="1" data-k="${k}" aria-label="${T.position} ${k+1}"><div class="pos">${T.position} ${k+1}</div></div>`).join("")}
   <button class="open" id="open">${T.open}</button></div><div class="feedback" id="fb"></div></div>`;
  document.getElementById("toRooms").onclick = home;
  app.querySelectorAll(".chest").forEach(b=>b.onclick=()=>puzzle(+b.dataset.k));
  const ins = [...app.querySelectorAll(".lock input")];
  ins.forEach((inp,k)=>inp.oninput=()=>{ inp.value=inp.value.replace(/\D/g,"").slice(0,1); if(inp.value && ins[k+1]) ins[k+1].focus(); });
  document.getElementById("open").onclick = ()=>{
    const code = ins.map(x=>x.value).join("");
    if(code === S.digits.join("")) win();
    else { ins.forEach(bad); oops(document.getElementById("fb"), T.wrongCode); }
  };
}

function win(){
  clearInterval(tick);
  const secs = Math.floor((Date.now()-S.start)/1000);
  if(!save[R.id] || secs < save[R.id]){ save[R.id]=secs; store(); }
  confetti(); say("¡Chao pescao!");
  const nxt = S.i+1 < ROOMS.length;
  app.innerHTML = `<div class="stage end">
    <div class="door">🚪🔓</div>
    <img src="${IMG}chao.webp" style="width:min(320px,75%);transform:rotate(-3deg)" alt="¡Chao pescao!"><br>
    <img class="fresca" src="${IMG}fresca.webp" alt="Fresca">
    <h2 class="outline">${T.win} ${fmt(secs)}!</h2>
    <div class="opts">${nxt?`<button class="next" id="nx">${T.next}</button>`:""}<button class="next" id="ag" style="background:var(--lime)">${T.again}</button><button class="next" id="hm" style="background:#fff">${T.rooms}</button></div></div>`;
  if(nxt) document.getElementById("nx").onclick=()=>startRoom(S.i+1);
  document.getElementById("ag").onclick=()=>startRoom(S.i);
  document.getElementById("hm").onclick=home;
}

/* ---------------- puzzle shell ---------------- */
function puzzle(k){
  const type = R.puzzles[k];
  app.innerHTML = `
  <div class="topbar"><button class="back" id="toRoom">${T.room}</button><div class="bar"><i style="width:0%"></i></div>${timerHTML()}</div>
  <div class="task outline">${k+1}. ${T.names[type]}<span class="sub">${T.how[type]}</span></div>
  <div class="stage" id="stage"></div>`;
  document.getElementById("toRoom").onclick = roomView;
  const stage = document.getElementById("stage");
  const done = () => {
    S.solved[k]=true; pop();
    stage.innerHTML = `<div style="font-size:24px;font-weight:900">${T.found}</div><div class="digit" style="font-family:'Luckiest Guy',sans-serif;font-size:120px;color:var(--pink);text-shadow:5px 5px 0 var(--ink)">${S.digits[k]}</div>
      <div class="pos" style="font-weight:900">${T.position} ${k+1}</div><button class="next" id="bk">${T.room}</button>`;
    setBar(1,1); document.getElementById("bk").onclick = roomView;
  };
  PUZ[type](stage, done);
}
function setBar(d,t){ const i=app.querySelector(".bar i"); if(i) i.style.width=Math.round(d/t*100)+"%"; }
// run a sequence of rounds; render(stage, item, next) calls next() when the round is solved
function rounds(stage, items, render, done){
  let i=0; const go=()=>{ setBar(i,items.length); if(i>=items.length) return done(); render(stage, items[i], ()=>{ i++; setTimeout(go, 900); }); }; go();
}
// multiple-choice round helper
function choice(stage, headHTML, opts, ans, onOk, sayText){
  stage.innerHTML = `${headHTML}<div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(b.dataset.o===ans){ b.classList.add("ok"); stage.querySelectorAll(".opt").forEach(x=>x.disabled=true); stage.querySelector("#fb").textContent="¡Muy bien!"; say(sayText||ans); onOk(); }
    else { bad(b); setTimeout(()=>b.classList.add("faded"),400); oops(stage.querySelector("#fb")); }
  });
}
const pickVP = (n, verbs) => { const out=[], seen=new Set(); let guard=0; while(out.length<n && guard++<200){ const v=rnd(verbs), p=Math.floor(Math.random()*6); if(!seen.has(v+p)){ seen.add(v+p); out.push([v,p]); } } return out; };
const verbLabel = v => R.id==="irregulares" && L==="en" ? `${v} <small>(${IRR_INF[v]})</small>` : v;

/* ---------------- puzzles ---------------- */
const PUZ = {};

PUZ.tabla = (stage, done) => {
  const v = rnd(R.verbs);
  const parts = [0,1,2,3,4,5].map(p=>R.split(v,p));
  const tiles = shuffle(parts.map(x=>x[1]));
  let p=0;
  const draw = () => {
    stage.innerHTML = `<div class="bigpic" style="font-size:70px;min-height:80px">${V[v]?V[v].e:"⭐"}</div>
      <div style="font-size:30px;font-weight:900">${verbLabel(v)}</div>
      <div class="table">${parts.map((x,i)=>`<div class="pr">${PRON[i]}</div><div class="row ${i===p?"cur":""}">${esc(x[0])}<span class="slot ${i<p?"filled":""}">${i<p?esc(x[1]):"?"}</span>${esc(x[2])}</div>`).join("")}</div>
      <div class="tiles">${tiles.map((t,i)=>`<button class="letter" style="width:auto;padding:0 14px" data-i="${i}">${esc(t)}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
    stage.querySelectorAll(".letter").forEach(b=>b.onclick=()=>{
      if(p>=6) return;
      const t = tiles[+b.dataset.i];
      if(t===parts[p][1]){ say(R.form(v,p)); tiles.splice(+b.dataset.i,1); p++; setBar(p,6); if(p===6) setTimeout(done,700); else draw(); }
      else { bad(b); oops(stage.querySelector("#fb")); }
    });
  };
  draw();
};

PUZ.quien = (stage, done) => {
  rounds(stage, pickVP(5, R.verbs), (st,[v,p],next)=>{
    choice(st, `<div class="question">«${R.form(v,p)}»</div>`, PRON, PRON[p], next, R.form(v,p));
  }, done);
};

PUZ.intruso = (stage, done) => {
  const items = [0,1,2].map(()=>{
    const p = 1+Math.floor(Math.random()*5);
    const vs = shuffle(REG).slice(0,4); const w = Math.floor(Math.random()*4);
    const opts = vs.map((v,i)=>{ if(i!==w) return R.form(v,p);
      const c=V[v].c, other = c==="ar" ? "er" : (p===3||p===4 ? (c==="er"?"ir":"er") : "ar");
      return stem(v)+END[other][p]; });
    return {p, opts, wrong:opts[w], right:R.form(vs[w],p)};
  });
  rounds(stage, items, (st,it,next)=>{
    choice(st, `<div class="question" style="font-size:28px">${PRON[it.p]}: ?</div>`, it.opts, it.wrong, ()=>{ st.querySelector("#fb").textContent = `✔ ${it.wrong} → ${it.right}`; say(it.right); next(); });
  }, done);
};

function typed(stage, headHTML, ans, next){
  stage.innerHTML = `${headHTML}<div class="typed"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="next" id="ck">${T.check}</button></div>
    <div class="typed">${["á","é","í","ó","ú","ñ"].map(a=>`<button class="acc" data-a="${a}">${a}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  const ti = stage.querySelector("#ti"), fb = stage.querySelector("#fb"); ti.focus();
  let fails=0;
  stage.querySelectorAll(".acc").forEach(b=>b.onclick=()=>{ const s=ti.selectionStart??ti.value.length; ti.value=ti.value.slice(0,s)+b.dataset.a+ti.value.slice(ti.selectionEnd??s); ti.focus(); ti.selectionStart=ti.selectionEnd=s+1; });
  const check = () => {
    const v = norm(ti.value), a = norm(ans);
    if(v===a){ ti.disabled=true; ti.style.background="var(--lime)"; fb.textContent="¡Muy bien! "+ans; say(ans); next(); }
    else if(noAcc(v)===noAcc(a)){ ti.disabled=true; ti.style.background="var(--lime)"; fb.textContent=`${T.almost} ${ans}`; say(ans); next(); }
    else { fails++; bad(ti); if(fails>=2){ fb.innerHTML=`<img src="${IMG}fresca.webp" alt=""> ${T.answerIs} <b style="color:var(--pink)">${esc(ans)}</b>. ${T.typeIt}`; } else oops(fb); ti.select(); }
  };
  stage.querySelector("#ck").onclick = check;
  ti.onkeydown = e => { if(e.key==="Enter") check(); };
}

PUZ.escribe = (stage, done) => {
  rounds(stage, pickVP(3, R.verbs), (st,[v,p],next)=>{
    let subj = rnd(SUBJ[p]);
    if(R.marker && !/^(Ana|Pablo)/.test(subj)) subj = subj[0].toLowerCase()+subj.slice(1);
    const sent = `${R.marker?R.marker+" ":""}${subj} <b style="color:var(--pink)">___</b> (${v}) ${V[v].o}.`;
    typed(st, `<div class="bigpic" style="font-size:70px;min-height:80px">${V[v].e}</div><div class="gapline" style="font-size:28px">${sent}</div>`, R.form(v,p), next);
  }, done);
};

PUZ.escribe2 = (stage, done) => {
  rounds(stage, shuffle(SE).slice(0,3), (st,[s,v,p,en,sv],next)=>{
    typed(st, `<div class="gapline" style="font-size:30px">${s.replace("___",`<b style="color:var(--pink)">___</b>`)} <span style="color:var(--soft)">(${v})</span></div><div class="gloss">${L==="en"?"EN: "+en:"SV: "+sv}</div>`, IRR[v][p], next);
  }, done);
};

PUZ.traduce = (stage, done) => {
  rounds(stage, pickVP(4, R.verbs), (st,[v,p],next)=>{
    const others = shuffle([0,1,2,3,4,5].filter(x=>x!==p)).slice(0,3);
    const opts = shuffle([p,...others].map(x=>R.form(v,x)));
    choice(st, `<div class="gloss">${T.how.traduce}</div><div class="question"><span class="en" style="font-size:30px">${esc(gloss(R,v,p))}</span></div>`, opts, R.form(v,p), next);
  }, done);
};

PUZ.serestar = (stage, done) => {
  rounds(stage, shuffle(SE).slice(0,5), (st,[s,v,p,en,sv],next)=>{
    const opts = ["ser","estar","tener","ir"].map(x=>IRR[x][p]);
    choice(st, `<div class="gapline" style="font-size:30px">${s.replace("___","<b>&nbsp;?&nbsp;</b>")}</div><div class="gloss">${L==="en"?"EN: "+en:"SV: "+sv}</div>`, opts, IRR[v][p], next, s.replace("___",IRR[v][p]));
  }, done);
};

PUZ.ordena = (stage, done) => {
  rounds(stage, pickVP(3, ALL), (st,[v,p],next)=>{
    let subj = rnd(SUBJ[p]); if(!/^(Ana|Pablo)/.test(subj)) subj = subj[0].toLowerCase()+subj.slice(1);
    const words = `Mañana ${subj} ${R.form(v,p)} ${V[v].o} .`.split(" ");
    const tiles = shuffle(words.map((w,i)=>({w,i})));
    st.innerHTML = `<div class="bigpic" style="font-size:70px;min-height:80px">${V[v].e}</div><div class="gloss">${L==="en"?"EN":"SV"}: ${esc(gloss(R,v,p))}</div>
      <div class="slots">${words.map(()=>`<div class="slot wslot"></div>`).join("")}</div>
      <div class="tiles">${tiles.map(t=>`<button class="word" data-w="${esc(t.w)}">${esc(t.w)}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
    let pos=0; const slots = st.querySelectorAll(".slot");
    st.querySelectorAll(".word").forEach(b=>b.onclick=()=>{
      if(b.dataset.w===words[pos]){ slots[pos].textContent=words[pos]; slots[pos].classList.add("filled"); b.classList.add("used"); pos++;
        if(pos===words.length){ say(words.join(" ")); st.querySelector("#fb").textContent="¡Muy bien!"; next(); } }
      else { bad(b); oops(st.querySelector("#fb")); }
    });
  }, done);
};

PUZ.participio = (stage, done) => {
  const irr = shuffle(Object.keys(PP_IRR)).slice(0,3), reg = shuffle(REG.filter(v=>!PP_IRR[v])).slice(0,1);
  rounds(stage, shuffle([...irr,...reg]), (st,v,next)=>{
    const other = pp(rnd(ALL.filter(x=>x!==v)));
    const opts = shuffle([...new Set([pp(v), ppBad(v), other])]);
    choice(st, `<div class="bigpic" style="font-size:70px;min-height:80px">${V[v].e}</div><div class="question">${v} → he ___</div>`, opts, pp(v), next, "he "+pp(v));
  }, done);
};

PUZ.gerundio = (stage, done) => {
  const irr = shuffle(Object.keys(GER_IRR)), reg = shuffle(REG.filter(v=>!GER_IRR[v])).slice(0,1);
  rounds(stage, shuffle([...irr,...reg]), (st,v,next)=>{
    const p = Math.floor(Math.random()*6);
    const other = ger(rnd(ALL.filter(x=>x!==v)));
    const opts = shuffle([...new Set([ger(v), gerBad(v), other])]);
    let subj = rnd(SUBJ[p]); subj = /^(Ana|Pablo)/.test(subj) ? subj : subj[0].toLowerCase()+subj.slice(1);
    choice(st, `<div class="bigpic" style="font-size:70px;min-height:80px">${V[v].e}</div><div class="question" style="font-size:30px">(${v}) Ahora ${subj} ${IRR.estar[p]} ___ ${V[v].o}.</div>`,
      opts, ger(v), next, `Ahora ${subj} ${IRR.estar[p]} ${ger(v)} ${V[v].o}.`);
  }, done);
};

home();
})();
</script>
