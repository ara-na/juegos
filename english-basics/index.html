<!DOCTYPE html>

<style>

  @media (max-width:560px){ .feel .fe{font-size:42px} .feel{font-size:16px} }

  kitchen:{name:"🍳 Kitchen", pack:"restaurant", sentences:R_SENT, gaps:R_GAPS, items:[
    ["knife","🔪"],["fork","🍴"],["spoon","🥄"],["plate","🍽️"],["bowl","🥣"],["glass","🥃"],["pan","🍳"],["chef","🧑‍🍳"],["salt","🧂"],["chopsticks","🥢"],["teapot","🫖"],["menu","📋"],["bill","🧾"],["bell","🛎️"]]},

    ["burger","🍔"],["chips","🍟"],["pasta","🍝"],["soup","🍲"],["salad","🥗"],["sandwich","🥪"],["rice","🍚"],["steak","🥩"],["taco","🌮"],["pancakes","🥞"],["hot dog","🌭"],["sushi","🍣"],["noodles","🍜"],["egg","🍳"]]},

const SENTENCES = [
  ["I like pizza .","🍕"],["The cat is black .","🐈‍⬛"],["She has a dog .","👧🐶"],["I am happy .","😀"],

  ["The apple is red .","🍎"],["I have two cats .","🐱🐱"],["The bird can fly .","🐦"],["I go to school .","🏫"],
  ["Do you like milk ?","🥛"],["The sun is hot .","☀️"],["I can swim .","🏊"],["This is my bag .","🎒"],
  ["The fish is blue .","🐟"],["I eat an apple .","🍎"],["He is tall .","🧍"],["It is cold today .","🥶"]

const GAPS = [
  ["I ___ happy.",["am","is","are"],"am","😀"],
  ["The dog ___ big.",["am","is","are"],"is","🐶"],
  ["They ___ friends.",["am","is","are"],"are","👫"],
  ["You ___ my friend.",["am","is","are"],"are","🤝"],
  ["She ___ a cat.",["have","has"],"has","👧🐱"],
  ["I ___ a bike.",["have","has"],"have","🚲"],
  ["This is ___ apple.",["a","an"],"an","🍎"],
  ["This is ___ banana.",["a","an"],"a","🍌"],

  ["I can see two ___.",["cat","cats"],"cats","🐱🐱"],
  ["I have one ___.",["dog","dogs"],"dog","🐶"],
  ["The sun is ___.",["yellow","blue","green"],"yellow","☀️"],
  ["The grass is ___.",["red","green","black"],"green","🌱"],
  ["We ___ football.",["play","plays"],"play","⚽"],
  ["He ___ pizza.",["like","likes"],"likes","👦🍕"],
  ["The fish is ___ the water.",["in","on","under"],"in","🐟💧"],
  ["The cat is ___ the bed.",["in","on","under"],"on","🐱🛏️"],
  ["The ball is ___ the table.",["in","on","under"],"under","⚽"],
  ["___ is my mum.",["She","He"],"She","👩"],
  ["___ is my dad.",["She","He"],"He","👨"]

const STICKERS = ["🦄","🐉","🦊","🐼","🐙","🦋","🚀","🌈","🍩","🎸","🏆","👑","🦖","🐬","🍀","⚡","🎮","🛹","🦁","🌟","🍔","🐧","🎈","💎","🦜","🏀","🎧","🐢","🌋","🛸"];
const STARS_PER_STICKER = 10;
const PRAISE = ["Great!","Super!","Well done!","Yes!","Perfect!","Good job!","Amazing!"];
const PRAISE_SV = ["Bra jobbat!","Snyggt!","Toppen!","Rätt!","Jättebra!"];

/* ---------------- STATE ---------------- */
let state = {stars:0, topic:"animals"};
try{ const s = JSON.parse(localStorage.getItem("englishFunStudion")||"null"); if(s) state = Object.assign(state,s); }catch(e){}
try{ const f=new URLSearchParams(location.search).get("focus"); if(f) state.focus = (f==="off"?null:f); }catch(e){}
function save(){ try{ localStorage.setItem("englishFunStudion", JSON.stringify(state)); }catch(e){} }

const app = document.getElementById("app");
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const items = () => TOPICS[state.topic].items;

function picHTML(p, size){
  if(typeof p === "string") return p;
  if(p.c) { const s = size||110; return `<span class="dot" style="width:${s}px;height:${s}px;background:${p.c}"></span>`; }
  if(p.n) { return `<span class="num" style="font-size:${size?size:110}px">${p.n}</span>`; }
}

/* speech */
let voice = null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); voice = v.find(x=>/en[-_]GB/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
const canSpeak = (()=>{ try{ return 'speechSynthesis' in window; }catch(e){ return false; } })();
function say(text){
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/ \./g,".").replace(/ \?/g,"?")); u.lang="en-GB"; u.rate=.8; if(voice) u.voice=voice; speechSynthesis.speak(u); }catch(e){}
}

function addStar(n=1){ const before = Math.floor(state.stars/STARS_PER_STICKER); state.stars += n; save(); const el=document.getElementById("starCount"); if(el) el.textContent=state.stars; return Math.floor(state.stars/STARS_PER_STICKER) > before; }

/* ---------------- MENU ---------------- */
const ACTS = [
  {id:"match", ico:"🧩", t:"Match it", sv:"Para ihop", col:"var(--blue)"},
  {id:"choose", ico:"🤔", t:"What is it?", sv:"Vad är det?", col:"var(--red)"},
  {id:"listen", ico:"👂", t:"Listen and click", sv:"Lyssna och klicka", col:"var(--lime)"},
  {id:"spell", ico:"🔤", t:"Spell the word", sv:"Stava ordet", col:"var(--pink)"},
  {id:"memory", ico:"🃏", t:"Memory", sv:"Memory", col:"var(--purple)"},
  {id:"sentence", ico:"🧱", t:"Make a sentence", sv:"Bygg en mening", col:"var(--green)"},
  {id:"gap", ico:"✍️", t:"Fill the gap", sv:"Fyll i luckan", col:"var(--orange)"}
];

function menu(){
  const unlocked = Math.min(STICKERS.length, Math.floor(state.stars/STARS_PER_STICKER));
  const toNext = STARS_PER_STICKER - (state.stars % STARS_PER_STICKER);
  app.innerHTML = `
  <a class="home" href="../index.html">🏠 ¡A jugar!</a>
  <header>
    <h1 class="outline"><span class="w3">English</span> <span class="w1">Fun!</span></h1>
    <div class="stars">⭐ <span id="starCount">${state.stars}</span></div>
  </header>
  <div class="fresca-row"><img class="fresca" src="../img/pj/pera.webp" alt="Pera"><div class="bubble">Hi! I'm Pera. Let's play!<span class="sv">Hej! Jag heter Pera. Nu spelar vi!</span></div></div>
  ${missionPanel()}
  <div class="panel">
    <p class="label">1. Choose a topic <span class="sv">Välj ett tema</span></p>
    <div class="topics">${Object.entries(TOPICS).map(([k,v])=>`<button class="topic ${k===state.topic?'on':''}" data-t="${k}">${v.name}</button>`).join("")}</div>
    <p class="note">${TOPICS[state.topic].sentences?"🍽️ Restaurang: temat gäller för alla spel, även meningar och luckor.":"Temat gäller för: Match, What is it?, Listen, Spell och Memory."}</p>
  </div>
  <div class="panel">
    <p class="label">2. Choose a game <span class="sv">Välj ett spel</span></p>
    <div class="grid">${ACTS.map(a=>`<button class="act" style="background:${a.col}" data-a="${a.id}"><span class="ico">${a.ico}</span><span>${a.t}<span class="sv">${a.sv}</span></span></button>`).join("")}</div>
  </div>
  <div class="grid" style="margin-bottom:18px">
    <button class="act" id="toMusic" style="background:var(--cyan)"><span class="ico">🎧</span><span>Music quiz<span class="sv">Musiktest – vilken musiktyp är du?</span></span></button>
    ${state.music?`<button class="act" id="toSecret" style="background:#1b1b1b;color:#fff"><span class="ico">🔒</span><span>My secret<span class="sv" style="color:#ccc">Min hemliga favorit</span></span></button>`:""}
    <a class="act" href="../watch/" style="background:var(--pink);text-decoration:none;color:var(--ink)"><span class="ico">🎬</span><span>Watch & think<span class="sv">Titta och tänk – videor</span></span></a>
    <a class="act" href="../reto/?g=english" style="background:var(--lime);text-decoration:none;color:var(--ink)"><span class="ico">🏆</span><span>Class challenge<span class="sv">Klassen mot Fresca</span></span></a>
  </div>
  ${albumSummaryEN()}`;
  app.querySelectorAll(".topic").forEach(b=>b.onclick=()=>{state.topic=b.dataset.t; save(); menu();});
  app.querySelectorAll(".act[data-a]").forEach(b=>b.onclick=()=>GAMES[b.dataset.a]());
  document.getElementById("toMusic").onclick = musicQuiz;
  const td=document.getElementById("toDay"); if(td) td.onclick = myDay;
  const gm=document.getElementById("goMission"); if(gm) gm.onclick = ()=>startMission(nextMission());
  const nb=document.getElementById("newBlock"); if(nb) nb.onclick = newBlock;
  app.querySelectorAll(".mi[data-m]").forEach(b=>b.onclick=()=>startMission(day().missions[+b.dataset.m]));
  const sk=document.getElementById("toSecret"); if(sk) sk.onclick = secretPage;
  document.getElementById("toAlbum").onclick = album;
}

/* ---------------- SHELL ---------------- */
function shell(title, sv, done, total){
  app.innerHTML = `
  <div class="topbar">
    <button class="back" id="back">← Menu</button>
    <div class="bar"><i style="width:${total?Math.round(done/total*100):0}%"></i></div>
    <div class="stars">⭐ <span id="starCount">${state.stars}</span></div>
  </div>
  <div class="task outline">${title}<span class="sv">${sv}</span></div>
  <div class="stage" id="stage"></div>`;
  document.getElementById("back").onclick = menu;
  return document.getElementById("stage");
}
function setBar(done,total){ const i=app.querySelector(".bar i"); if(i) i.style.width = Math.round(done/total*100)+"%"; }

function finish(gameFn, earned, newSticker, total){
  confetti();
  const gid = Object.keys(GAMES).find(k=>GAMES[k]===gameFn);
  const extra = tickMission(gid) + recordFinish(earned, total);
  const st = newSticker ? STICKERS[Math.min(STICKERS.length,Math.floor(state.stars/STARS_PER_STICKER))-1] : null;
  app.innerHTML = `
  <div class="topbar"><button class="back" id="back">← Menu</button><div style="flex:1"></div><div class="stars">⭐ <span id="starCount">${state.stars}</span></div></div>
  <div class="stage end">
    <img class="fresca" src="../img/pj/pera.webp" alt="Pera"><div class="big">🏆</div>
    <h2 class="outline">${rnd(PRAISE)}</h2>
    <div style="font-size:24px;font-weight:800">Du fick / You got ${earned} ⭐ <span class="sv">${rnd(PRAISE_SV)}</span></div>
    ${st?`<div class="newsticker">New sticker! / Nytt klistermärke!<span>${st}</span></div>`:""}
    ${extra}
    <div class="opts" style="margin-top:22px">
      ${nextMission()?`<button class="next" id="nextM" style="background:var(--pink);color:#fff">▶ Next mission / Nästa uppdrag</button>`:""}
      ${day()&&day().done&&!nextMission()?`<button class="next" id="brk" style="background:var(--cyan)">☕ Break / Paus</button>`:""}
      <button class="next" id="again">🔁 Igen / Again</button>
      <button class="next" id="tomenu" style="background:var(--lime)">🏠 Meny</button>
      ${extra.trim()?`<button class="next" id="toAlb" style="background:var(--cyan)">📒 Album</button>`:""}
      ${day()&&day().done?`<button class="next" id="toMyDay" style="background:var(--pink);color:#fff">📒 My day</button>`:""}
    </div>
  </div>`;
  document.getElementById("back").onclick = menu;
  document.getElementById("tomenu").onclick = menu;
  document.getElementById("again").onclick = gameFn;
  const ta=document.getElementById("toAlb"); if(ta) ta.onclick=album;
  const nm=document.getElementById("nextM"); if(nm) nm.onclick=()=>startMission(nextMission());
  const bk=document.getElementById("brk"); if(bk) bk.onclick=breakTime;
  const tmd=document.getElementById("toMyDay"); if(tmd) tmd.onclick=myDay;
  if(st || extra.trim()) say("New sticker!");
}
function confetti(){
  const e=["⭐","🎉","✨","🌟","🎊"];
  for(let i=0;i<26;i++){ const s=document.createElement("div"); s.className="confetti"; s.textContent=rnd(e); s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.6+Math.random()*1.8)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3600); }
}
function speakBtn(text){ return canSpeak?`<button class="speak" data-say="${text}">🔊</button>`:""; }
function wireSpeak(root){ root.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say)); }

/* generic question-runner */
function runQuestions(gameFn, title, sv, qs, renderQ){
  let i=0, earned=0, sticker=false;
  const stage = shell(title, sv, 0, qs.length);
  const next = () => {
    if(i>=qs.length){ finish(gameFn, earned, sticker, qs.length); return; }
    setBar(i, qs.length);
    renderQ(stage, qs[i], (firstTry)=>{ if(firstTry){ earned++; if(gameFn===GAMES.spell){ state.spellOk=(state.spellOk||0)+1; save(); } if(addStar()) sticker=true; } i++; setTimeout(next, 1100); });
  };
  next();
}

/* ---------------- GAMES ---------------- */
const GAMES = {};

/* 1. MATCH */
GAMES.match = function(){
  const set = shuffle(items()).slice(0,6);
  const stage = shell("Match the picture and the word", "Para ihop bild och ord", 0, set.length);
  const pics = shuffle(set), words = shuffle(set);
  stage.innerHTML = `<div class="match">
    <div class="col">${pics.map(([w,p])=>`<button class="tile pic" data-w="${w}">${picHTML(p,48)}</button>`).join("")}</div>
    <div class="col">${words.map(([w])=>`<button class="tile wd" data-w="${w}">${w}</button>`).join("")}</div>
  </div><div class="feedback" id="fb"></div>`;
  let selPic=null, selWord=null, matched=0, earned=0, sticker=false, misses=0;
  const fb = stage.querySelector("#fb");
  const check = () => {
    if(!selPic||!selWord) return;
    if(selPic.dataset.w===selWord.dataset.w){
      [selPic,selWord].forEach(t=>{t.classList.remove("sel");t.classList.add("ok");t.disabled=true;});
      say(selWord.dataset.w); matched++; setBar(matched,set.length);
      if(misses===0){ earned++; if(addStar()) sticker=true; }
      misses=0; fb.textContent = rnd(PRAISE);
      if(matched===set.length) setTimeout(()=>finish(GAMES.match,earned,sticker,set.length),1200);
    } else {
      misses++; [selPic,selWord].forEach(t=>{t.classList.remove("sel");t.classList.add("bad");setTimeout(()=>t.classList.remove("bad"),450);});
      fb.innerHTML = `<img src="../img/pj/pera_icon.webp" alt=""> Försök igen! / Try again!`;
    }
    selPic=selWord=null;
  };
  stage.querySelectorAll(".tile.pic").forEach(t=>t.onclick=()=>{ stage.querySelectorAll(".tile.pic").forEach(x=>x.classList.remove("sel")); selPic=t; t.classList.add("sel"); check(); });
  stage.querySelectorAll(".tile.wd").forEach(t=>t.onclick=()=>{ stage.querySelectorAll(".tile.wd").forEach(x=>x.classList.remove("sel")); selWord=t; t.classList.add("sel"); check(); });
};

/* 2. CHOOSE */
GAMES.choose = function(){
  const qs = shuffle(items()).slice(0,8);
  runQuestions(GAMES.choose, "What is it?", "Vad är det? Välj rätt ord", qs, (stage,[w,p],done)=>{
    const opts = shuffle([w, ...shuffle(items().filter(x=>x[0]!==w)).slice(0,2).map(x=>x[0])]);
    stage.innerHTML = `<div class="bigpic">${picHTML(p)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    let first=true;
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===w){ b.classList.add("ok"); stage.querySelectorAll(".opt").forEach(x=>x.disabled=true); say(w); stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); }
      else { first=false; b.classList.add("bad"); setTimeout(()=>{b.classList.remove("bad");b.classList.add("faded");},400); stage.querySelector("#fb").innerHTML=`<img src="../img/pj/pera_icon.webp" alt=""> Försök igen! / Try again!`; }
    });
  });
};

/* 3. LISTEN */
GAMES.listen = function(){
  const qs = shuffle(items()).slice(0,8);
  runQuestions(GAMES.listen, "Listen and click the picture", "Lyssna och klicka på bilden", qs, (stage,[w,p],done)=>{
    const opts = shuffle([[w,p], ...shuffle(items().filter(x=>x[0]!==w)).slice(0,3)]);
    stage.innerHTML = `
      ${canSpeak?`<button class="speak" id="play" style="font-size:34px;padding:12px 28px">🔊 Lyssna / Listen</button>`:""}
      <div id="showw" style="font-size:40px;font-weight:900;margin-top:8px;${canSpeak?'visibility:hidden':''}">${w}</div>
      ${canSpeak?`<button class="hint" id="showbtn">👀 Show the word / Visa ordet</button>`:""}
      <div class="pics">${opts.map(([ow,op])=>`<button class="picbtn" data-o="${ow}">${picHTML(op,90)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    if(canSpeak){ stage.querySelector("#play").onclick=()=>say(w); stage.querySelector("#showbtn").onclick=()=>{stage.querySelector("#showw").style.visibility="visible";}; setTimeout(()=>say(w),350); }
    let first=true;
    stage.querySelectorAll(".picbtn").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===w){ b.classList.add("ok"); stage.querySelectorAll(".picbtn").forEach(x=>x.disabled=true); stage.querySelector("#showw").style.visibility="visible"; stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); }
      else { first=false; b.classList.add("bad"); setTimeout(()=>{b.classList.remove("bad");b.classList.add("faded");},400); stage.querySelector("#fb").innerHTML=`<img src="../img/pj/pera_icon.webp" alt=""> Lyssna igen! / Listen again!`; }
    });
  });
};

/* 4. SPELL */
GAMES.spell = function(){
  const pool = items().filter(([w])=>!w.includes(" ") && w.length<=7);
  const qs = shuffle(pool).slice(0,6);
  runQuestions(GAMES.spell, "Spell the word", "Stava ordet – klicka på bokstäverna i rätt ordning", qs, (stage,[w,p],done)=>{
    const letters = shuffle(w.split("").map((l,i)=>({l,i})));
    stage.innerHTML = `<div class="bigpic">${picHTML(p)}</div>
      <div class="slots">${w.split("").map(()=>`<div class="slot"></div>`).join("")}</div>
      <div class="tiles">${letters.map((o,k)=>`<button class="letter" data-l="${o.l}" data-k="${k}">${o.l}</button>`).join("")}</div>
      <button class="hint" id="hint">💡 Help / Hjälp</button>
      <div class="feedback" id="fb"></div>`;
    let pos=0, first=true;
    const slots = stage.querySelectorAll(".slot");
    stage.querySelector("#hint").onclick=()=>{ first=false; say(w); const fb=stage.querySelector("#fb"); fb.textContent=w; setTimeout(()=>{ if(pos<w.length) fb.textContent=""; },1800); };
    stage.querySelectorAll(".letter").forEach(b=>b.onclick=()=>{
      if(b.dataset.l===w[pos]){ slots[pos].textContent=w[pos]; slots[pos].classList.add("filled"); b.classList.add("used"); pos++;
        if(pos===w.length){ say(w); stage.querySelector("#fb").textContent=rnd(PRAISE)+" "+w; done(first); } }
      else { first=false; b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),400); }
    });
  });
};

/* 5. MEMORY */
GAMES.memory = function(){
  const set = shuffle(items()).slice(0,6);
  const stage = shell("Memory: find the picture and the word", "Hitta bilden och ordet som hör ihop", 0, set.length);
  const cards = shuffle([...set.map(([w,p])=>({w,p,type:"pic"})), ...set.map(([w])=>({w,type:"word"}))]);
  stage.innerHTML = `<div class="mem">${cards.map((c,i)=>`<button class="card" data-i="${i}">?</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  let open=[], found=0, lock=false, tries=0;
  const els = stage.querySelectorAll(".card");
  const show = (i)=>{ const c=cards[i], el=els[i]; el.classList.add("open"); if(c.type==="word"){el.classList.add("w"); el.textContent=c.w;} else el.innerHTML=picHTML(c.p,54); };
  const hide = (i)=>{ const el=els[i]; el.classList.remove("open","w"); el.textContent="?"; };
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i; if(lock||open.includes(i)||el.classList.contains("done")) return;
    show(i); open.push(i);
    if(open.length===2){
      const [a,b]=open; tries++;
      if(cards[a].w===cards[b].w && cards[a].type!==cards[b].type){
        els[a].classList.add("done"); els[b].classList.add("done"); say(cards[a].w); found++; setBar(found,set.length); open=[];
        stage.querySelector("#fb").textContent=rnd(PRAISE);
        if(found===set.length){ const earned = tries<=10?6:tries<=14?5:4; let st=false; for(let k=0;k<earned;k++) if(addStar()) st=true; setTimeout(()=>finish(GAMES.memory,earned,st,tries<=8?earned:99),1200); }
      } else { lock=true; setTimeout(()=>{hide(a);hide(b);open=[];lock=false;},1100); }
    }
  });
};

/* 6. SENTENCE */
GAMES.sentence = function(){
  const qs = shuffle(TOPICS[state.topic].sentences||SENTENCES).slice(0,6);
  runQuestions(GAMES.sentence, "Make a sentence", "Bygg en mening – klicka på orden i rätt ordning", qs, (stage,[s,p],done)=>{
    const words = s.split(" ");
    const tiles = shuffle(words.map((w,i)=>({w,i})));
    stage.innerHTML = `<div class="bigpic" style="font-size:90px;min-height:110px">${p}</div>
      <div class="slots">${words.map(()=>`<div class="slot wslot"></div>`).join("")}</div>
      <div class="tiles">${tiles.map(t=>`<button class="word" data-w="${t.w}">${t.w}</button>`).join("")}</div>
      <button class="hint" id="hint">💡 Help / Hjälp</button>
      <div class="feedback" id="fb"></div>`;
    let pos=0, first=true;
    const slots = stage.querySelectorAll(".slot");
    stage.querySelector("#hint").onclick=()=>{ first=false; say(s); const btn=[...stage.querySelectorAll(".word")].find(b=>!b.classList.contains("used")&&b.dataset.w===words[pos]); if(btn){btn.classList.add("ok"); setTimeout(()=>btn.classList.remove("ok"),900);} };
    stage.querySelectorAll(".word").forEach(b=>b.onclick=()=>{
      if(b.dataset.w===words[pos]){ slots[pos].textContent=words[pos]; slots[pos].classList.add("filled"); b.classList.add("used"); pos++;
        if(pos===words.length){ say(s); stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); } }
      else { first=false; b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),400); }
    });
  });
};

/* 7. GAP */
GAMES.gap = function(){
  const qs = shuffle(TOPICS[state.topic].gaps||GAPS).slice(0,8);
  runQuestions(GAMES.gap, "Fill the gap", "Fyll i luckan – välj rätt ord", qs, (stage,[s,opts,ans,p],done)=>{
    stage.innerHTML = `<div class="bigpic" style="font-size:90px;min-height:110px">${p}</div>
      <div class="gapline" id="line">${s.replace("___","<b>&nbsp;?&nbsp;</b>")}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    let first=true;
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===ans){ b.classList.add("ok"); stage.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        stage.querySelector("#line").innerHTML = s.replace("___",`<b>${ans}</b>`); say(s.replace("___",ans)); stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); }
      else { first=false; b.classList.add("bad"); setTimeout(()=>{b.classList.remove("bad");b.classList.add("faded");},400); stage.querySelector("#fb").innerHTML=`<img src="../img/pj/pera_icon.webp" alt=""> Försök igen! / Try again!`; }
    });
  });
};
