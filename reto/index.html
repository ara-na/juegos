<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Reto de clase! · ¡A jugar!</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/games.css">
<link rel="icon" href="../img/fresca.webp">
<style>
  .wrap{max-width:1400px}
  .pick{display:flex;flex-wrap:wrap;gap:12px}
  .pick button{background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:18px;padding:12px 20px;font-size:22px;font-weight:900}
  .pick button.on{background:var(--pink);color:#fff}
  .pick button.now{outline:4px dashed var(--pink);outline-offset:3px}
  .go{background:var(--lime);border:var(--bd);box-shadow:var(--sh);border-radius:22px;padding:16px 40px;font-family:'Luckiest Guy',sans-serif;font-size:40px;margin-top:10px}
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:12px}
  .team{border:var(--bd);box-shadow:var(--sh);border-radius:22px;padding:8px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between}
  .team.clase{background:var(--cyan)} .team.fr{background:var(--pink);color:#fff}
  .team b{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:clamp(22px,3vw,40px)}
  .team .pts{font-family:'Luckiest Guy',sans-serif;font-size:clamp(40px,6vw,80px);line-height:1}
  .team img{height:clamp(50px,7vw,90px)}
  .qnum{font-weight:900;font-size:clamp(16px,2vw,24px);text-align:center}
  .clock{height:26px;background:#fff;border:var(--bd);border-radius:999px;overflow:hidden;margin-bottom:14px}
  .clock i{display:block;height:100%;background:var(--lime);transition:width .25s linear}
  .clock.hurry i{background:var(--red)}
  .board{background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:26px;padding:clamp(14px,2vw,30px);text-align:center}
  .prompt{font-size:clamp(30px,5vw,72px);font-weight:900;line-height:1.15;margin:4px 0 6px}
  .prompt .pic{font-size:clamp(90px,14vw,200px);line-height:1}
  .prompt .en{font-size:clamp(28px,4.5vw,60px)}
  .prompt b.gap{display:inline-block;min-width:2.5em;border-bottom:.12em solid var(--pink);color:var(--pink)}
  .rhint{font-size:clamp(16px,2vw,26px);color:var(--soft);font-weight:800;margin-bottom:10px}
  .answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin-top:14px}
  .ans{display:flex;align-items:center;gap:14px;background:var(--lime);border:var(--bd);box-shadow:var(--sh);border-radius:20px;padding:14px 18px;font-size:clamp(22px,3.2vw,44px);font-weight:900;text-align:left}
  .ans:nth-child(2){background:var(--cyan)} .ans:nth-child(3){background:var(--orange)}
  .ans .k{color:var(--ink);font-family:'Luckiest Guy',sans-serif;background:#fff;border:3px solid var(--ink);border-radius:12px;min-width:1.4em;text-align:center;font-size:.9em}
  .ans.right{background:var(--green)!important;color:#fff;transform:scale(1.03)}
  .ans.wrong{background:#ddd!important;opacity:.45}
  .ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .ctrl button{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 16px;font-size:18px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
  .ctrl .big{background:var(--pink);color:#fff;font-size:24px;padding:12px 26px}
  .keys{color:var(--soft);font-size:14px;font-weight:800;text-align:center;margin-top:10px}
  .winner{text-align:center;padding:20px}
  .winner .tit{font-family:'Luckiest Guy',sans-serif;font-size:clamp(36px,6vw,80px);line-height:1.05}
  .winner{padding:10px}.winner img.st{width:min(300px,50vw);max-height:26vh;object-fit:contain}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../engine/base.js"></script>
<script src="../units/es-de-donde-eres.js"></script>
<script src="../units/es-mi-familia.js"></script>
<script src="../units/es-que-te-gusta.js"></script>
<script src="../units/es-heladeria.js"></script>
<script src="../units/es-ropa.js"></script>
<script src="../units/es-describir.js"></script>
<script src="../units/es-verbos.js"></script>
<script src="../units/es-mi-barrio.js"></script>
<script src="../units/es-peru.js"></script>
<script src="../units/es-restaurante.js"></script>
<script src="../units/es-gerundio.js"></script>
<script src="groups.js"></script>
<script>
(function(){
const app = document.getElementById("app");
const IMG = "../img/";
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
let voice=null; function pickVoice(){ try{ const v=speechSynthesis.getVoices(); voice=v.find(x=>/es[-_]ES/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function say(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/ ([.?!])/g,"$1").replace("___","…")); u.lang="es-ES"; u.rate=.85; if(voice) u.voice=voice; speechSynthesis.speak(u); }catch(e){} }

const TX = {
 sv:{ title:"Klassen mot Fresca", group:"1. Välj klass", unit:"2. Välj tema", count:"3. Antal frågor", secs:"4. Sekunder per fråga", start:"¡A jugar!",
      clase:"Klassen", q:"Fråga", of:"av", reveal:"Visa svaret", next:"Nästa ➜", read:"🔊 Läs upp", pause:"⏸ Paus", resume:"▶ Fortsätt",
      full:"⛶ Helskärm", menu:"← Meny", keys:"Tangenter: A B C = svar · Mellanslag = visa svar / nästa · R = läs upp · P = paus",
      howPic:"Vad heter det på spanska?", howGap:"Vilket ord saknas?", howQa:"Vilket är det bästa svaret?",
      win:"¡Ganó la clase!", lose:"¡Ganó Fresca!", tie:"¡Empate!", again:"🔁 Otra vez", howto:"Visa på tavlan. Klassen svarar högt tillsammans – läraren klickar på svaret." },
 en:{ title:"The class vs Fresca", group:"1. Choose a class", unit:"2. Choose a unit", count:"3. Number of questions", secs:"4. Seconds per question", start:"¡A jugar!",
      clase:"The class", q:"Question", of:"of", reveal:"Show answer", next:"Next ➜", read:"🔊 Read aloud", pause:"⏸ Pause", resume:"▶ Resume",
      full:"⛶ Full screen", menu:"← Menu", keys:"Keys: A B C = answer · Space = show answer / next · R = read aloud · P = pause",
      howPic:"What is it in Spanish?", howGap:"Which word is missing?", howQa:"Which is the best answer?",
      win:"¡Ganó la clase!", lose:"¡Ganó Fresca!", tie:"¡Empate!", again:"🔁 Otra vez", howto:"Project this. The class answers out loud together – the teacher clicks the answer." }
};
let cfg = {g:"myp12", u:null, n:10, s:20};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem("aJugar-reto")||"{}")); }catch(e){}
if(!GROUPS[cfg.g]) cfg.g="myp12";
const qp = new URLSearchParams(location.search); if(GROUPS[qp.get("g")]) cfg.g = qp.get("g");
const T = () => TX[GROUPS[cfg.g].lang];
const tr = v => (v && typeof v==="object") ? (v[GROUPS[cfg.g].lang] || v.en) : v;

function pic(p){
  if(typeof p==="string") return `<div class="pic">${p}</div>`;
  if(p.c) return `<div class="pic"><span style="display:inline-block;width:1em;height:1em;border-radius:50%;background:${p.c};border:6px solid #141414"></span></div>`;
  if(p.n!==undefined) return `<div class="pic"><span class="num">${p.n}</span></div>`;
  if(p.t) return `<span class="en">${esc(tr(p.t))}</span>`;
}

/* ---------- setup ---------- */
function setup(){
  const G = GROUPS[cfg.g]; if(!G.units.includes(cfg.u)) cfg.u = G.current;
  const t = T();
  app.innerHTML = `
  <a class="home" href="../index.html">🏠 ¡A jugar!</a>
  <header><h1 class="outline"><span class="w1">¡Reto</span> <span class="w2">de</span> <span class="w3">clase!</span><span class="sub">🏆 ${t.title}</span></h1></header>
  <div class="fresca-row"><img class="fresca" src="${IMG}fresca.webp" alt="Fresca"><div class="bubble">${t.howto}</div></div>
  <div class="panel"><p class="label">${t.group}</p><div class="pick">${Object.entries(GROUPS).map(([k,g])=>`<button data-g="${k}" class="${k===cfg.g?"on":""}">${esc(g.name)}</button>`).join("")}</div></div>
  <div class="panel"><p class="label">${t.unit}</p><div class="pick">${G.units.map(id=>{const u=UNITS[id]; return `<button data-u="${id}" class="${id===cfg.u?"on":""} ${id===G.current?"now":""}">${u.icon} ${esc(u.title)}</button>`;}).join("")}</div></div>
  <div class="panel" style="display:flex;flex-wrap:wrap;gap:30px">
    <div><p class="label">${t.count}</p><div class="pick">${[5,10,15,20].map(n=>`<button data-n="${n}" class="${n===cfg.n?"on":""}">${n}</button>`).join("")}</div></div>
    <div><p class="label">${t.secs}</p><div class="pick">${[10,20,30,0].map(n=>`<button data-s="${n}" class="${n===cfg.s?"on":""}">${n||"∞"}</button>`).join("")}</div></div>
  </div>
  <div style="text-align:center"><button class="go" id="go">${t.start}</button></div>
  <footer>✏️ Fresca: diseño de Elliot</footer>`;
  const sv = () => { try{ localStorage.setItem("aJugar-reto", JSON.stringify(cfg)); }catch(e){} };
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ cfg.g=b.dataset.g; cfg.u=GROUPS[cfg.g].current; sv(); setup(); });
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{ cfg.u=b.dataset.u; sv(); setup(); });
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ cfg.n=+b.dataset.n; sv(); setup(); });
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ cfg.s=+b.dataset.s; sv(); setup(); });
  document.getElementById("go").onclick = start;
}

const fw = s => s.toLowerCase().replace(/[¿?¡!.,]/g,"").split(" ")[0];
const qaWrong = (list, a, n) => { const ok=list.filter(x=>x[1]!==a && fw(x[1])!==fw(a)); return (ok.length>=n?ok:list.filter(x=>x[1]!==a)); };
/* ---------- questions ---------- */
function buildQuestions(U, n){
  const vocab = Object.values(U.topics).flatMap(t=>t.items.map(it=>({it, all:t.items})));
  const pool = [];
  shuffle(vocab).forEach(({it,all})=>{
    const [w,p]=it; const others = shuffle(all.filter(x=>x[0]!==w)).slice(0,2).map(x=>x[0]);
    if(others.length===2) pool.push({kind:"pic", prompt:pic(p), say:null, opts:shuffle([w,...others]), ans:w});
  });
  const gaps = shuffle(U.gaps||[]).map(([s,opts,ans,p,gl])=>({kind:"gap", prompt:`${pic(p)}<div>${esc(s).replace("___",'<b class="gap">?</b>')}</div>`, gloss:gl?tr(gl.t):"", say:s, full:s.replace("___",ans), opts:shuffle([ans,...shuffle(opts.filter(o=>o!==ans)).slice(0,2)]), ans}));
  const qa = shuffle(U.qa||[]).map(([q,a])=>({kind:"qa", prompt:`💬 ${esc(q)}`, say:q, full:q+" "+a, opts:shuffle([a,...shuffle(qaWrong(U.qa||[],a,2)).slice(0,2).map(x=>x[1])]), ans:a}));
  // mix: ~45% vocab, ~30% gaps, ~25% qa
  const want = {pic:Math.round(n*.45), gap:Math.round(n*.3)}; want.qa = n - want.pic - want.gap;
  let out = [...pool.slice(0,want.pic), ...gaps.slice(0,want.gap), ...qa.slice(0,want.qa)];
  const rest = shuffle([...pool.slice(want.pic), ...gaps.slice(want.gap), ...qa.slice(want.qa)]);
  while(out.length<n && rest.length) out.push(rest.pop());
  return shuffle(out).slice(0,n);
}

/* ---------- game ---------- */
let G=null, timer=null;
function start(){
  const U = UNITS[cfg.u];
  G = {U, qs:buildQuestions(U, cfg.n), i:0, clase:0, fresca:0, left:cfg.s, done:false, paused:false};
  document.onkeydown = keys;
  show();
}
function scoreHTML(){
  const t=T();
  return `<div class="score">
    <div class="team clase"><b>${t.clase}</b><span class="pts" id="pc">${G.clase}</span></div>
    <div class="qnum">${t.q} ${Math.min(G.i+1,G.qs.length)} ${t.of} ${G.qs.length}</div>
    <div class="team fr"><span class="pts" id="pf">${G.fresca}</span><b>Fresca</b><img src="${IMG}pj/fresca_icon.webp" alt=""></div></div>`;
}
function show(){
  clearInterval(timer);
  if(G.i>=G.qs.length) return end();
  const q=G.qs[G.i], t=T(); G.done=false; G.left=cfg.s; G.paused=false;
  const how = q.kind==="pic"?t.howPic : q.kind==="gap"?t.howGap : t.howQa;
  app.innerHTML = `
  <div class="topbar"><button class="back" id="menu">${t.menu}</button><div style="flex:1"></div><button class="back" id="full">${t.full}</button></div>
  ${scoreHTML()}
  ${cfg.s?`<div class="clock" id="clock"><i style="width:100%"></i></div>`:""}
  <div class="board">
    <div class="rhint">${how}</div>
    <div class="prompt">${q.prompt}</div>
    ${q.gloss?`<div class="rhint">${esc(q.gloss)}</div>`:""}
    <div class="answers">${q.opts.map((o,k)=>`<button class="ans" data-o="${esc(o)}"><span class="k">${"ABC"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="ctrl">${q.say?`<button id="read">${t.read}</button>`:""}${cfg.s?`<button id="pause">${t.pause}</button>`:""}<button class="big" id="act">${t.reveal}</button></div>
  </div>
  <div class="keys">${t.keys}</div>`;
  document.getElementById("menu").onclick = ()=>{ clearInterval(timer); document.onkeydown=null; setup(); };
  document.getElementById("full").onclick = ()=>{ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){} };
  if(q.say){ document.getElementById("read").onclick = ()=>say(q.say); setTimeout(()=>say(q.say),300); }
  if(cfg.s) document.getElementById("pause").onclick = togglePause;
  document.getElementById("act").onclick = ()=> G.done ? next() : judge(null);
  app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>judge(b.dataset.o));
  if(cfg.s) timer = setInterval(tick, 250);
  window.scrollTo(0,0);
}
function tick(){
  if(G.paused || G.done) return;
  G.left -= .25;
  const c=document.getElementById("clock"); if(!c) return;
  c.querySelector("i").style.width = Math.max(0, G.left/cfg.s*100)+"%";
  c.classList.toggle("hurry", G.left <= 5);
  if(G.left<=0) judge(null);
}
function togglePause(){ if(!cfg.s || G.done) return; G.paused=!G.paused; const b=document.getElementById("pause"); if(b) b.textContent = G.paused ? T().resume : T().pause; }
function judge(choice){
  if(G.done) return; G.done=true; clearInterval(timer);
  const q=G.qs[G.i], ok = choice===q.ans;
  app.querySelectorAll(".ans").forEach(b=>{ if(b.dataset.o===q.ans) b.classList.add("right"); else b.classList.add("wrong"); });
  if(ok){ G.clase++; popSticker(); } else G.fresca++;
  document.getElementById("pc").textContent=G.clase; document.getElementById("pf").textContent=G.fresca;
  say(q.full || q.ans);
  const a=document.getElementById("act"); a.textContent=T().next;
}
function next(){ G.i++; show(); }
function popSticker(){ const im=document.createElement("img"); im.className="pop"; im.src=IMG+rnd(["vamos","planazo","quefuerte","todobien"])+".webp"; im.alt=""; document.body.appendChild(im); setTimeout(()=>im.remove(),1200); }
function keys(e){
  if(!G || !document.querySelector(".board")) return;
  const k=e.key.toLowerCase();
  if(["a","b","c"].includes(k)){ const b=app.querySelectorAll(".ans")["abc".indexOf(k)]; if(b && !G.done) judge(b.dataset.o); }
  else if(k===" " || k==="enter"){ e.preventDefault(); G.done ? next() : judge(null); }
  else if(k==="r"){ const q=G.qs[G.i]; if(q && q.say) say(q.say); }
  else if(k==="p") togglePause();
}
function end(){
  document.onkeydown=null; const t=T();
  const res = G.clase>G.fresca ? "win" : G.clase<G.fresca ? "lose" : "tie";
  const st = res==="win" ? "chao" : res==="lose" ? "quefuerte" : "todobien";
  if(res==="win"){ const e=["⭐","🎉","✨","🌟","🎊"]; for(let i=0;i<40;i++){ const s=document.createElement("div"); s.className="confetti"; s.textContent=rnd(e); s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.6+Math.random()*1.8)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3600); } }
  say(res==="win" ? "¡Ganó la clase! ¡Chao pescao!" : res==="lose" ? "¡Ganó Fresca! ¡Qué fuerte!" : "¡Empate!");
  app.innerHTML = `
  <div class="score">
    <div class="team clase"><b>${t.clase}</b><span class="pts">${G.clase}</span></div><div></div>
    <div class="team fr"><span class="pts">${G.fresca}</span><b>Fresca</b><img src="${IMG}pj/fresca_icon.webp" alt=""></div></div>
  <div class="board winner">
    <img class="st" src="${IMG}${st}.webp" alt=""><br><img class="fresca" src="${IMG}fresca.webp" alt="Fresca" style="width:auto;height:min(130px,16vh)">
    <div class="tit outline" style="color:${res==="win"?"var(--lime)":"var(--pink)"}">${t[res]}</div>
    <div class="ctrl"><button class="big" id="again">${t.again}</button><button id="menu">${t.menu}</button></div></div>`;
  document.getElementById("again").onclick = start;
  document.getElementById("menu").onclick = setup;
}

setup();
})();
</script>
</body>
</html>
