<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡En directo! · Profe · ¡A jugar!</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/games.css">
<link rel="stylesheet" href="live.css">
<link rel="icon" href="../img/pj/fresca_icon.webp">
</head>
<body>
<div class="wrap" id="app"><p style="font-weight:900">Cargando…</p></div>
<script src="../engine/base.js"></script>
<script src="../units/es-de-donde-eres.js"></script><script src="../units/es-mi-familia.js"></script><script src="../units/es-que-te-gusta.js"></script>
<script src="../units/es-heladeria.js"></script><script src="../units/es-ropa.js"></script><script src="../units/es-describir.js"></script>
<script src="../units/es-verbos.js"></script><script src="../units/es-mi-barrio.js"></script><script src="../units/es-peru.js"></script>
<script src="../units/es-restaurante.js"></script><script src="../units/es-gerundio.js"></script>
<script src="../reto/groups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
import { login, R, set, get, update, remove, onValue, onDisconnect, serverTimestamp, now, PJ, esc } from "./fb.js";
const app = document.getElementById("app"), IMG = "../img/";
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const JOIN = "ara-na.github.io/juegos/live";
const TX = {
 sv:{ title:"Live-quiz", cls:"1. Välj klass", unit:"2. Välj tema", count:"3. Antal frågor", secs:"4. Sekunder per fråga", create:"Skapa spel",
      join:"Gå till", code:"och skriv koden", players:"spelare", start:"Starta! ▶", waiting:"Väntar på spelare…", answered:"har svarat",
      next:"Nästa ➜", reveal:"Visa svaret", top:"Topplista", podium:"Prispallen", close:"Avsluta och radera spelet", closed:"Spelet är raderat. ¡Chao pescao!",
      q:"Fråga", of:"av", again:"Nytt spel", note:"Spelet raderas automatiskt när du stänger den här fliken.", kick:"Klicka på en spelare för att ta bort den." },
 en:{ title:"Live quiz", cls:"1. Choose a class", unit:"2. Choose a unit", count:"3. Number of questions", secs:"4. Seconds per question", create:"Create game",
      join:"Go to", code:"and enter the code", players:"players", start:"Start! ▶", waiting:"Waiting for players…", answered:"have answered",
      next:"Next ➜", reveal:"Show answer", top:"Leaderboard", podium:"Podium", close:"End and delete the game", closed:"The game has been deleted. ¡Chao pescao!",
      q:"Question", of:"of", again:"New game", note:"The game is deleted automatically when you close this tab.", kick:"Click a player to remove them." }
};
let cfg = {g:"ak7", u:null, n:10, s:20};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem("aJugar-live")||"{}")); }catch(e){}
if(!GROUPS[cfg.g]) cfg.g="ak7";
const L = () => GROUPS[cfg.g].lang, T = () => TX[L()];
const tr = v => (v && typeof v==="object") ? (v[L()] || v.en) : v;
let voice=null; try{ const pv=()=>{ const v=speechSynthesis.getVoices(); voice=v.find(x=>/es[-_]ES/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null; }; pv(); speechSynthesis.onvoiceschanged=pv; }catch(e){}
function say(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace("___","…")); u.lang="es-ES"; u.rate=.85; if(voice) u.voice=voice; speechSynthesis.speak(u); }catch(e){} }

function pic(p){
  if(typeof p==="string") return `<div class="lpic">${p}</div>`;
  if(p.c) return `<div class="lpic"><span style="display:inline-block;width:1em;height:1em;border-radius:50%;background:${p.c};border:5px solid #141414"></span></div>`;
  if(p.n!==undefined) return `<div class="lpic"><span class="num">${p.n}</span></div>`;
  if(p.t) return `<span class="en">${esc(tr(p.t))}</span>`;
}
const fw = s => s.toLowerCase().replace(/[¿?¡!.,]/g,"").split(" ")[0];
const qaWrong = (list, a, n) => { const ok=list.filter(x=>x[1]!==a && fw(x[1])!==fw(a)); return (ok.length>=n?ok:list.filter(x=>x[1]!==a)); };
function buildQuestions(U, n){
  const pool = shuffle(Object.values(U.topics).flatMap(t=>t.items.map(it=>({it, all:t.items})))).map(({it,all})=>{
    const [w,p]=it, others=shuffle(all.filter(x=>x[0]!==w)).slice(0,3).map(x=>x[0]);
    return others.length>=2 ? {html:pic(p), opts:shuffle([w,...others]), ans:w, say:null} : null; }).filter(Boolean);
  const gaps = shuffle(U.gaps||[]).map(([s,opts,ans,p,gl])=>({html:`${pic(p)}<div class="lsent">${esc(s).replace("___",'<b class="gap">?</b>')}</div>${gl?`<div class="lgloss">${esc(tr(gl.t))}</div>`:""}`,
      opts:shuffle([ans,...shuffle(opts.filter(o=>o!==ans)).slice(0,3)]), ans, say:s}));
  const qa = shuffle(U.qa||[]).map(([q,a])=>({html:`<div class="lsent">💬 ${esc(q)}</div>`, opts:shuffle([a,...shuffle(qaWrong(U.qa||[],a,3)).slice(0,3).map(x=>x[1])]), ans:a, say:q}));
  const want = {p:Math.round(n*.45), g:Math.round(n*.3)}; want.q = n-want.p-want.g;
  let out=[...pool.slice(0,want.p),...gaps.slice(0,want.g),...qa.slice(0,want.q)];
  const rest=shuffle([...pool.slice(want.p),...gaps.slice(want.g),...qa.slice(want.q)]);
  while(out.length<n && rest.length) out.push(rest.pop());
  return shuffle(out).slice(0,n);
}

/* ---------------- setup ---------------- */
function setup(){
  const G=GROUPS[cfg.g]; if(!G.units.includes(cfg.u)) cfg.u=G.current; const t=T();
  app.innerHTML = `<a class="home" href="../index.html">🏠 ¡A jugar!</a>
  <header><h1 class="outline"><span class="w1">¡En</span> <span class="w3">directo!</span><span class="sub">📡 ${t.title}</span></h1></header>
  <div class="panel"><p class="label">${t.cls}</p><div class="pick">${Object.entries(GROUPS).map(([k,g])=>`<button data-g="${k}" class="${k===cfg.g?"on":""}">${esc(g.name)}</button>`).join("")}</div></div>
  <div class="panel"><p class="label">${t.unit}</p><div class="pick">${G.units.map(id=>`<button data-u="${id}" class="${id===cfg.u?"on":""}">${UNITS[id].icon} ${esc(UNITS[id].title)}</button>`).join("")}</div></div>
  <div class="panel" style="display:flex;flex-wrap:wrap;gap:30px">
   <div><p class="label">${t.count}</p><div class="pick">${[5,10,15,20].map(n=>`<button data-n="${n}" class="${n===cfg.n?"on":""}">${n}</button>`).join("")}</div></div>
   <div><p class="label">${t.secs}</p><div class="pick">${[10,20,30].map(n=>`<button data-s="${n}" class="${n===cfg.s?"on":""}">${n}</button>`).join("")}</div></div></div>
  <div style="text-align:center"><button class="go" id="go">${t.create}</button></div><div class="feedback" id="err"></div>`;
  const sv=()=>{ try{ localStorage.setItem("aJugar-live", JSON.stringify(cfg)); }catch(e){} };
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ cfg.g=b.dataset.g; cfg.u=GROUPS[cfg.g].current; sv(); setup(); });
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{ cfg.u=b.dataset.u; sv(); setup(); });
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ cfg.n=+b.dataset.n; sv(); setup(); });
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ cfg.s=+b.dataset.s; sv(); setup(); });
  document.getElementById("go").onclick = ()=>create().catch(e=>{ document.getElementById("err").textContent = "⚠️ "+e.message; });
}

/* ---------------- game state ---------------- */
let uid, code, QS, players={}, scores={}, unsub=[], timer=null, gq=-1, revealed=false;
const paths = c => ["keys/"+c, "players/"+c, "scores/"+c, "responses/"+c, "games/"+c];   // games last: the rules check it

async function create(){
  try{ uid = await login(); }catch(e){ throw new Error("login: "+e.message); }
  for(let i=0;i<20;i++){ const c=String(10000+Math.floor(Math.random()*90000)); if(!(await get(R("games/"+c))).exists()){ code=c; break; } }
  const U = UNITS[cfg.u]; QS = buildQuestions(U, cfg.n);
  const step = async (name, pr) => { try{ return await pr; }catch(e){ throw new Error(name+": "+e.message); } };
  await step("games", set(R("games/"+code), {host:uid, created:serverTimestamp(), state:"lobby", q:-1, n:QS.length, secs:cfg.s, lang:L(), title:U.title,
     questions: QS.map(q=>({html:q.html, opts:q.opts}))}));
  await step("keys", set(R("keys/"+code), QS.map(q=>q.opts.indexOf(q.ans))));
  // everything disappears if this tab closes or loses connection
  for(const p of paths(code)) await step("cleanup "+p.split("/")[0], onDisconnect(R(p)).remove());
  unsub.push(onValue(R("players/"+code), s=>{ players=s.val()||{}; if(gq<0) lobby(); else liveCount(); }));
  unsub.push(onValue(R("scores/"+code), s=>{ scores=s.val()||{}; }));
  lobby();
}
function lobby(){
  const t=T(), list=Object.entries(players);
  let qr=""; try{ const q=qrcode(0,"M"); q.addData("https://"+JOIN+"/?c="+code); q.make(); qr=q.createSvgTag({cellSize:6,margin:2}); }catch(e){}
  app.innerHTML = `<div class="lobby">
    <div class="joinbox panel"><div class="sub">${t.join}</div><div class="url">${JOIN}</div><div class="sub">${t.code}</div><div class="code">${code.slice(0,2)} ${code.slice(2)}</div></div>
    <div class="qr panel">${qr}</div></div>
    <div class="panel"><p class="label">👥 ${list.length} ${t.players} <span class="sub">${list.length?t.kick:t.waiting}</span></p>
     <div class="plist">${list.map(([id,p])=>`<button class="pl" data-id="${id}"><img src="${IMG}pj/${p.av}_icon.webp" alt=""><span>${esc(p.name)}</span></button>`).join("")}</div></div>
    <div style="text-align:center"><button class="go" id="start" ${list.length?"":"disabled"}>${t.start}</button></div>
    <footer>🔒 ${t.note}</footer>`;
  app.querySelectorAll(".pl").forEach(b=>b.onclick=()=>remove(R(`players/${code}/${b.dataset.id}`)));
  document.getElementById("start").onclick = ()=>ask(0);
}
async function ask(i){
  gq=i; revealed=false; answers={}; clearInterval(timer);
  await remove(R(`responses/${code}/${i-1}`)).catch(()=>{});
  await update(R("games/"+code), {state:"question", q:i, qStart:serverTimestamp(), correct:null});
  const q=QS[i], t=T();
  app.innerHTML = `<div class="topbar"><div class="qnum">${t.q} ${i+1} ${t.of} ${QS.length}</div><div style="flex:1"></div><div class="stars">🔑 ${code}</div></div>
   <div class="clock" id="clock"><i style="width:100%"></i></div>
   <div class="board"><div class="prompt">${q.html}</div>
    <div class="lans">${q.opts.map((o,k)=>`<div class="la c${k}"><span class="k">${"▲●■★"[k]}</span>${esc(o)}</div>`).join("")}</div>
    <div class="ctrl"><span class="count" id="cnt">0 / ${Object.keys(players).length} ${t.answered}</span><button class="big" id="rv">${t.reveal}</button></div></div>`;
  document.getElementById("rv").onclick = reveal;
  if(q.say) setTimeout(()=>say(q.say),300);
  const t0=Date.now(); qT0=now();
  timer=setInterval(()=>{ const left=cfg.s - (Date.now()-t0)/1000; const c=document.getElementById("clock"); if(c){ c.querySelector("i").style.width=Math.max(0,left/cfg.s*100)+"%"; c.classList.toggle("hurry",left<=5); } if(left<=0) reveal(); },200);
  if(respOff){ try{respOff();}catch(e){} }
  respOff = onValue(R(`responses/${code}/${i}`), s=>{ if(gq!==i) return; answers=s.val()||{}; liveCount(); if(Object.keys(answers).length>=Object.keys(players).length && Object.keys(players).length) setTimeout(reveal,600); });
}
let answers={}, respOff=null, qT0=0;
function liveCount(){ const c=document.getElementById("cnt"); if(c) c.textContent=`${Object.keys(answers).length} / ${Object.keys(players).length} ${T().answered}`; }
async function reveal(){
  if(revealed) return; revealed=true; clearInterval(timer);
  const i=gq, q=QS[i], key=q.opts.indexOf(q.ans);
  const g=(await get(R("games/"+code))).val(), resp=(await get(R(`responses/${code}/${i}`))).val()||{};
  const upd={}, dist=[0,0,0,0];
  for(const id of Object.keys(players)){
    const r=resp[id], old=scores[id]||{s:0,st:0};
    let pts=0, ok=false;
    if(r){ dist[r.a]=(dist[r.a]||0)+1; ok = r.a===key;
      if(ok){ const qs=(typeof g.qStart==="number")?g.qStart:qT0; const el=Math.max(0,Math.min(1,(r.t-qs)/(cfg.s*1000))); pts=Math.round(1000-500*el) + Math.min(300,100*old.st); } }
    upd[id]={s:old.s+pts, st: ok?old.st+1:0, last:pts, ok, ans: r? r.a : -1};
  }
  await set(R("scores/"+code), upd); scores=upd;
  const top=Object.entries(upd).sort((a,b)=>b[1].s-a[1].s).slice(0,5).map(([id,v])=>({name:players[id]?.name||"?", av:players[id]?.av||"fresca", s:v.s}));
  await update(R("games/"+code), {state:"reveal", correct:key, top});
  say(q.say ? q.say.replace("___", q.ans) : q.ans);
  const t=T(), max=Math.max(1,...dist);
  app.innerHTML = `<div class="topbar"><div class="qnum">${t.q} ${i+1} ${t.of} ${QS.length}</div><div style="flex:1"></div><div class="stars">🔑 ${code}</div></div>
   <div class="board"><div class="prompt small">${q.html}</div>
    <div class="lans">${q.opts.map((o,k)=>`<div class="la c${k} ${k===key?"right":"wrong"}"><span class="k">${"▲●■★"[k]}</span>${esc(o)}<b class="dist">${dist[k]||0}</b></div>`).join("")}</div></div>
   <div class="panel"><p class="label">🏆 ${t.top}</p>${top.map((p,k)=>`<div class="row"><span class="pos">${k+1}</span><img src="${IMG}pj/${p.av}_icon.webp" alt=""><b>${esc(p.name)}</b><span class="pts">${p.s}</span></div>`).join("")}</div>
   <div style="text-align:center"><button class="go" id="nx">${i+1<QS.length?t.next:"🏆 "+t.podium}</button></div>`;
  document.getElementById("nx").onclick = ()=> i+1<QS.length ? ask(i+1) : end();
}
async function end(){
  const t=T(), top=Object.entries(scores).sort((a,b)=>b[1].s-a[1].s).slice(0,3).map(([id,v])=>({name:players[id]?.name||"?", av:players[id]?.av||"fresca", s:v.s}));
  await update(R("games/"+code), {state:"end", top});
  await remove(R("keys/"+code)); await remove(R("responses/"+code));
  say("¡Chao pescao!");
  const order=[1,0,2];
  app.innerHTML = `<div class="board winner"><img src="${IMG}chao.webp" alt="" style="width:min(300px,60vw)">
   <div class="podium">${order.filter(k=>top[k]).map(k=>`<div class="step s${k}"><img src="${IMG}pj/${top[k].av}_card.webp" alt=""><b>${esc(top[k].name)}</b><span>${top[k].s}</span><div class="blk">${k+1}</div></div>`).join("")}</div>
   <div class="ctrl"><button class="big" id="close">🗑️ ${t.close}</button></div></div>`;
  for(let k=0;k<40;k++){ const s=document.createElement("div"); s.className="confetti"; s.textContent=rnd(["⭐","🎉","✨","🌟","🎊"]); s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.6+Math.random()*1.8)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3600); }
  document.getElementById("close").onclick = closeGame;
}
async function closeGame(){
  if(respOff){ try{respOff();}catch(e){} }
  unsub.forEach(f=>{ try{f();}catch(e){} }); unsub=[];
  for(const p of paths(code)) await remove(R(p)).catch(()=>{});
  app.innerHTML = `<div class="board winner"><img class="fresca" src="${IMG}pj/fresca.webp" alt=""><h2>${T().closed}</h2><button class="go" id="again">${T().again}</button></div>`;
  gq=-1; document.getElementById("again").onclick = ()=>location.reload();
}
setup();
</script>
</body>
</html>
