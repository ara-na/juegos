<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Juega en español! – MYP1-2</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f1e8; --card:#ffffff; --ink:#2b2b3a; --soft:#6d6d80;
    --red:#e2483d; --yellow:#f6b922; --teal:#16a3a3; --terra:#d9693a; --green:#2fb47c; --blue:#3f6fe8; --purple:#8b5cf6; --pink:#ec5f9a;
    --radius:22px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none}
  .wrap{max-width:980px;margin:0 auto;padding:18px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-size:34px;margin:0;font-weight:900;letter-spacing:-.5px}
  h1 span{color:var(--red)}
  .stars{background:var(--card);border-radius:999px;padding:8px 18px;font-size:24px;font-weight:900;box-shadow:0 3px 0 #e4dccd;display:flex;align-items:center;gap:8px}
  .sub{display:block;font-size:.62em;color:var(--soft);font-weight:700;margin-top:2px}
  .panel{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 0 #e4dccd;margin-bottom:16px}
  .label{font-weight:900;font-size:18px;margin:0 0 10px}
  .topics{display:flex;flex-wrap:wrap;gap:8px}
  .topic{background:#f2ebdf;border-radius:999px;padding:9px 16px;font-size:17px;font-weight:800;color:var(--ink)}
  .topic.on{background:var(--ink);color:#fff}
  .unit{font-size:12px;opacity:.7;margin-left:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .act{border-radius:var(--radius);padding:18px 16px;color:#fff;text-align:left;font-size:21px;font-weight:900;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s}
  .act:hover{transform:translateY(-3px)}
  .act:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .act .ico{font-size:44px;line-height:1}
  .act .sub{color:rgba(255,255,255,.88)}
  .shelf{display:flex;flex-wrap:wrap;gap:6px;font-size:34px;min-height:44px}
  .shelf .locked{filter:grayscale(1);opacity:.18}
  .note{color:var(--soft);font-size:15px;font-weight:700;margin-top:8px}

  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .back{background:var(--card);border-radius:14px;padding:10px 16px;font-size:18px;font-weight:900;box-shadow:0 3px 0 #e4dccd;color:var(--ink)}
  .bar{flex:1;height:18px;background:#e9e0d1;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
  .task{font-size:26px;font-weight:900;text-align:center;margin:6px 0 14px}
  .task .sub{font-size:.68em;color:#4a4a62}
  .stage{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:0 4px 0 #e4dccd;text-align:center}
  .bigpic{font-size:120px;line-height:1.1;margin:6px 0 10px;display:flex;justify-content:center;align-items:center;min-height:140px}
  .num{font-weight:900;color:var(--purple)}
  .en{display:inline-block;background:#eef3ff;border:3px solid #cfdaf7;color:#22336b;border-radius:18px;padding:10px 20px;font-weight:900;line-height:1.15}
  .en small{display:block;font-size:.45em;color:#6b7bb0;letter-spacing:1px}
  .opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:10px}
  .opt{background:#fff1e6;color:var(--ink);border-radius:18px;padding:16px 26px;font-size:28px;font-weight:900;min-width:150px;box-shadow:0 4px 0 #f0cdb3}
  .opt.long{font-size:22px;min-width:260px;text-align:left}
  .ok{background:var(--green)!important;color:#fff!important;box-shadow:0 4px 0 #1f8a5d!important}
  .bad{background:var(--red)!important;color:#fff!important;animation:shake .35s}
  .faded{opacity:.35;pointer-events:none}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .speak{background:var(--yellow);border-radius:999px;font-size:24px;padding:8px 18px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 #c99312}
  .feedback{font-size:28px;font-weight:900;min-height:40px;margin-top:14px}
  .next{background:var(--blue);color:#fff;border-radius:18px;padding:14px 34px;font-size:26px;font-weight:900;margin-top:10px;box-shadow:0 4px 0 #2f56cc}

  .match{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .col{display:flex;flex-direction:column;gap:10px}
  .tile{background:#f5efe4;border-radius:16px;padding:10px;font-size:24px;font-weight:900;min-height:72px;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 3px 0 #ddd3c2}
  .tile.pic{font-size:44px}
  .tile.pic .en{font-size:20px;padding:4px 12px;border-width:2px}
  .tile.sel{outline:5px solid var(--blue)}
  .slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 18px;min-height:70px}
  .slot{width:56px;height:66px;border-radius:14px;background:#f5efe4;border:3px dashed #d6cab4;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .slot.filled{border-style:solid;border-color:var(--green);background:#e6f7ef}
  .wslot{min-width:80px;padding:0 14px;width:auto}
  .tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .letter{background:var(--terra);color:#fff;border-radius:14px;width:62px;height:66px;font-size:34px;font-weight:900;box-shadow:0 4px 0 #a94b22}
  .word{background:var(--teal);color:#fff;border-radius:14px;padding:14px 20px;font-size:28px;font-weight:900;box-shadow:0 4px 0 #0d7a7a}
  .used{visibility:hidden}
  .hint{background:#f2ebdf;border-radius:999px;padding:8px 16px;font-size:18px;font-weight:800;color:var(--ink);margin-top:14px}
  .gapline{font-size:34px;font-weight:900;margin:8px 0 2px}
  .gapline b{display:inline-block;min-width:90px;border-bottom:5px solid var(--red);color:var(--red)}
  .gloss{color:var(--soft);font-weight:800;font-size:18px;margin-bottom:6px}
  .question{font-size:40px;font-weight:900;margin:10px 0 18px;color:var(--ink)}
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{aspect-ratio:1/1;border-radius:18px;background:var(--terra);color:#fff;font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #a94b22;padding:6px;word-break:break-word}
  .card.open{background:#fff;color:var(--ink);box-shadow:0 4px 0 #ddd3c2;border:3px solid var(--terra)}
  .card.open.w{font-size:21px}
  .card.open .en{font-size:17px;padding:4px 8px;border-width:2px}
  .card.done{background:#e6f7ef;border-color:var(--green);color:var(--ink)}
  .pics{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;margin:12px auto 0}
  .picbtn{background:#f5efe4;border-radius:20px;font-size:70px;padding:14px;box-shadow:0 4px 0 #ddd3c2;min-height:130px;display:flex;align-items:center;justify-content:center}
  .picbtn .en{font-size:26px}
  .end{text-align:center;padding:30px 10px}
  .end .big{font-size:90px}
  .end h2{font-size:40px;margin:6px 0}
  .confetti{position:fixed;top:-60px;font-size:36px;pointer-events:none;animation:fall linear forwards;z-index:9}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  .newsticker{background:#fff4d1;border-radius:18px;padding:14px;font-size:22px;font-weight:900;display:inline-block;margin-top:12px}
  .newsticker span{font-size:60px;display:block}
  @media (max-width:560px){
    h1{font-size:26px}.bigpic{font-size:90px}.opt{font-size:22px;min-width:120px;padding:14px 18px}.opt.long{min-width:0;width:100%}
    .mem{grid-template-columns:repeat(3,1fr)}.card{font-size:34px}.card.open.w{font-size:16px}
    .tile{font-size:19px}.tile.pic{font-size:34px}.question{font-size:30px}.gapline{font-size:26px}
  }
.home{display:inline-block;background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px;color:#2b2b3a;text-decoration:none;box-shadow:0 3px 0 #e2ddd0;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ DATA (MYP1-2 · U1 ¿De dónde eres? · U2 Mi familia · U3 ¿Qué te gusta hacer?) ============
   Each item: [spanish, prompt]   prompt = emoji string | {n:number} | {t:"English text"} */
const T = t => ({t});
const TOPICS = {
  saludos:{name:"👋 Greetings", u:"U1", items:[
    ["hola",T("Hello")],["adiós",T("Goodbye")],["buenos días",T("Good morning")],["buenas tardes",T("Good afternoon")],
    ["buenas noches",T("Good night")],["hasta luego",T("See you later")],["gracias",T("Thank you")],["por favor",T("Please")],
    ["¿qué tal?",T("How are you?")],["muy bien",T("Very good")],["me llamo…",T("My name is…")],["sí",T("Yes")],["no",T("No")]]},
  paises:{name:"🌍 Countries", u:"U1", items:[
    ["Suecia",T("Sweden")],["España",T("Spain")],["México",T("Mexico")],["Argentina",T("Argentina")],["Colombia",T("Colombia")],
    ["Perú",T("Peru")],["Chile",T("Chile")],["Cuba",T("Cuba")],["Inglaterra",T("England")],["Francia",T("France")],
    ["Alemania",T("Germany")],["Noruega",T("Norway")],["Estados Unidos",T("USA")]]},
  idiomas:{name:"🗣️ Languages", u:"U1", items:[
    ["sueco",T("Swedish")],["español",T("Spanish")],["inglés",T("English")],["francés",T("French")],["alemán",T("German")],
    ["árabe",T("Arabic")],["noruego",T("Norwegian")],["chino",T("Chinese")],["italiano",T("Italian")],["portugués",T("Portuguese")]]},
  numeros:{name:"🔢 Numbers", u:"U1–U3", items:[
    ["cero",{n:0}],["uno",{n:1}],["dos",{n:2}],["tres",{n:3}],["cuatro",{n:4}],["cinco",{n:5}],["seis",{n:6}],["siete",{n:7}],
    ["ocho",{n:8}],["nueve",{n:9}],["diez",{n:10}],["once",{n:11}],["doce",{n:12}],["trece",{n:13}],["catorce",{n:14}],
    ["quince",{n:15}],["dieciséis",{n:16}],["diecisiete",{n:17}],["dieciocho",{n:18}],["diecinueve",{n:19}],["veinte",{n:20}],
    ["cuarenta",{n:40}],["cuarenta y cinco",{n:45}],["cincuenta",{n:50}],["cincuenta y tres",{n:53}],["cincuenta y nueve",{n:59}]]},
  familia:{name:"👨‍👩‍👧 Family & pets", u:"U2", items:[
    ["el padre","👨"],["la madre","👩"],["el hermano","👦"],["la hermana","👧"],["el abuelo","👴"],["la abuela","👵"],
    ["el bebé","👶"],["los padres","👫"],["el perro","🐶"],["el gato","🐱"],["el pez","🐟"],["el pájaro","🐦"],
    ["el hámster","🐹"],["el conejo","🐰"],["el caballo","🐴"]]},
  ocio:{name:"⚽ Free time", u:"U3", items:[
    ["el fútbol","⚽"],["el baloncesto","🏀"],["el tenis","🎾"],["el hockey","🏒"],["nadar","🏊"],["bailar","💃"],
    ["leer","📖"],["dibujar","🎨"],["cantar","🎤"],["la música","🎵"],["los videojuegos","🎮"],["montar en bici","🚴"],
    ["ver la tele","📺"],["cocinar","🍳"],["correr","🏃"]]},
  dias:{name:"📅 Days", u:"U3", items:[
    ["lunes",T("Monday")],["martes",T("Tuesday")],["miércoles",T("Wednesday")],["jueves",T("Thursday")],
    ["viernes",T("Friday")],["sábado",T("Saturday")],["domingo",T("Sunday")],["hoy",T("today")],["el fin de semana",T("the weekend")]]}
};

const SENTENCES = [
  ["Me llamo Ana .","👋"],["¿Cómo te llamas ?","❓"],["Soy de Suecia .",T("I'm from Sweden.")],["¿De dónde eres ?","🌍"],
  ["Tengo doce años .",{n:12}],["¿Cuántos años tienes ?","🎂"],["Hablo sueco e inglés .","🗣️"],["Tengo un hermano .","👦"],
  ["Mi madre se llama Rosa .","👩"],["Tengo una hermana y un perro .","👧🐶"],["Es el gato de Pablo .","🐱"],
  ["Me gusta el fútbol .","⚽"],["No me gusta nadar .","🏊"],["Me gustan los videojuegos .","🎮"],["¿Te gusta bailar ?","💃"],
  ["Mi hermana tiene quince años .","👧"],["Mis abuelos son de España .","👴👵"],["Hoy es lunes .","📅"],
  ["Los sábados juego al tenis .","🎾"],["Su perro se llama Max .","🐶"]
];

const GAPS = [
  ["Me ___ Lucas.",["llamo","llamas"],"llamo","👦","My name is Lucas."],
  ["¿Cómo te ___?",["llamo","llamas"],"llamas","❓","What's your name?"],
  ["Yo ___ de Suecia.",["soy","eres","es"],"soy","🙋","I'm from Sweden."],
  ["¿De dónde ___ tú?",["soy","eres","es"],"eres","🌍","Where are you from?"],
  ["Ella ___ de México.",["soy","eres","es"],"es","👩","She is from Mexico."],
  ["Yo ___ trece años.",["tengo","tienes","tiene"],"tengo","🎂","I am 13."],
  ["¿Cuántos años ___ tú?",["tengo","tienes","tiene"],"tienes","❓","How old are you?"],
  ["Mi hermano ___ diez años.",["tengo","tienes","tiene"],"tiene","👦","My brother is 10."],
  ["Tengo ___ hermana.",["un","una"],"una","👧","I have a sister."],
  ["Tengo ___ perro.",["un","una"],"un","🐶","I have a dog."],
  ["___ padre se llama Juan.",["Mi","Tu","Su"],"Mi","👨","MY father is called Juan."],
  ["¿Cómo se llama ___ madre?",["mi","tu","su"],"tu","👩","What is YOUR mother called?"],
  ["Pablo y ___ gato.",["mi","tu","su"],"su","🐱","Pablo and HIS cat."],
  ["___ abuela es de Chile.",["El","La"],"La","👵","The grandmother is from Chile."],
  ["___ abuelo tiene un perro.",["El","La"],"El","👴","The grandfather has a dog."],
  ["Es el perro ___ Ana.",["de","la","es"],"de","🐶","It's Ana's dog."],
  ["Me ___ el fútbol.",["gusta","gustan"],"gusta","⚽","I like football."],
  ["Me ___ los gatos.",["gusta","gustan"],"gustan","🐱🐱","I like cats."],
  ["¿Te ___ bailar?",["gusta","gustan"],"gusta","💃","Do you like dancing?"],
  ["___ me gusta el tenis.",["No","Sí"],"No","🎾","I DON'T like tennis."],
  ["Hablo ___.",["sueco","Suecia"],"sueco","🗣️","I speak Swedish."],
  ["Soy de ___.",["España","español"],"España","🌍","I'm from Spain."],
  ["El sábado y el domingo son el ___.",["fin de semana","lunes"],"fin de semana","📅","Saturday and Sunday are the weekend."]
];

const QA = [
  ["¿Cómo te llamas?","Me llamo Leo."],["¿De dónde eres?","Soy de Suecia."],["¿Cuántos años tienes?","Tengo trece años."],
  ["¿Qué tal?","Muy bien, gracias."],["¿Qué idiomas hablas?","Hablo sueco e inglés."],["¿Tienes hermanos?","Sí, tengo una hermana."],
  ["¿Tienes mascota?","Sí, tengo un gato."],["¿Te gusta el fútbol?","Sí, me gusta mucho."],["¿Cómo se llama tu madre?","Se llama Eva."],
  ["¿Qué día es hoy?","Hoy es lunes."],["¿Qué deporte te gusta?","Me gusta el baloncesto."],["¿Dónde vives?","Vivo en Karlskrona."],
  ["¿Cuántos años tiene tu hermano?","Tiene nueve años."],["¿Qué te gusta hacer?","Me gusta leer y dibujar."]
];

const STICKERS = ["🌮","🪅","🦜","🌵","🎸","💃","⚽","🦙","🌶️","🏖️","🐂","🥘","🎺","🌞","🦩","🍉","🏆","👑","🚀","🌈","🐬","🦄","🎧","🛹","💎","🐢","🌋","🍦","🎮","🛸"];
const STARS_PER_STICKER = 10;
const PRAISE = ["¡Muy bien!","¡Genial!","¡Perfecto!","¡Fenomenal!","¡Bravo!","¡Excelente!","¡Fantástico!"];

/* ============ STATE ============ */
let state = {stars:0, topic:"familia"};
try{ const s = JSON.parse(localStorage.getItem("juegaEspanolMYP")||"null"); if(s) state = Object.assign(state,s); }catch(e){}
if(!TOPICS[state.topic]) state.topic="familia";
function save(){ try{ localStorage.setItem("juegaEspanolMYP", JSON.stringify(state)); }catch(e){} }

const app = document.getElementById("app");
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const items = () => TOPICS[state.topic].items;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function picHTML(p, size){
  if(typeof p === "string") return p;
  if(p.n!==undefined) return `<span class="num" style="font-size:${size||110}px">${p.n}</span>`;
  if(p.t) return `<span class="en" style="font-size:${size?Math.round(size*.5):44}px"><small>ENGLISH</small>${esc(p.t)}</span>`;
}

/* speech (Spanish) */
let voice = null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); voice = v.find(x=>/es[-_]ES/i.test(x.lang)) || v.find(x=>/^es/i.test(x.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
const canSpeak = (()=>{ try{ return 'speechSynthesis' in window; }catch(e){ return false; } })();
function say(text){
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/ ([.?])/g,"$1").replace("…","")); u.lang="es-ES"; u.rate=.8; if(voice) u.voice=voice; speechSynthesis.speak(u); }catch(e){}
}
function addStar(n=1){ const before = Math.floor(state.stars/STARS_PER_STICKER); state.stars += n; save(); const el=document.getElementById("starCount"); if(el) el.textContent=state.stars; return Math.floor(state.stars/STARS_PER_STICKER) > before; }

/* ============ MENU ============ */
const ACTS = [
  {id:"match", ico:"🧩", t:"Match it", s:"Pair the Spanish word with its meaning", col:"var(--blue)", topic:true},
  {id:"choose", ico:"🤔", t:"¿Qué es?", s:"Choose the right Spanish word", col:"var(--terra)", topic:true},
  {id:"listen", ico:"👂", t:"Escucha", s:"Listen and click the meaning", col:"var(--teal)", topic:true},
  {id:"spell", ico:"🔤", t:"Spell it", s:"Write the word letter by letter", col:"var(--pink)", topic:true},
  {id:"memory", ico:"🃏", t:"Memory", s:"Find the pairs", col:"var(--purple)", topic:true},
  {id:"sentence", ico:"🧱", t:"Make a sentence", s:"Put the words in order", col:"var(--green)"},
  {id:"gap", ico:"✍️", t:"Fill the gap", s:"ser, tener, mi/tu/su, gusta…", col:"#d39a10"},
  {id:"qa", ico:"💬", t:"Question & answer", s:"Find the right answer", col:"var(--red)"}
];

function menu(){
  const unlocked = Math.min(STICKERS.length, Math.floor(state.stars/STARS_PER_STICKER));
  const toNext = STARS_PER_STICKER - (state.stars % STARS_PER_STICKER);
  app.innerHTML = `
  <a class="home" href="../index.html">🏠 All games</a>
  <header>
    <h1>¡Juega en <span>español</span>! 🎉<span class="sub">MYP1-2 · Spanish practice</span></h1>
    <div class="stars">⭐ <span id="starCount">${state.stars}</span></div>
  </header>
  <div class="panel">
    <p class="label">1. Choose a topic</p>
    <div class="topics">${Object.entries(TOPICS).map(([k,v])=>`<button class="topic ${k===state.topic?'on':''}" data-t="${k}">${v.name}<span class="unit">${v.u}</span></button>`).join("")}</div>
    <p class="note">The topic is used in the first five games. The last three games mix everything.</p>
  </div>
  <div class="panel">
    <p class="label">2. Choose a game</p>
    <div class="grid">${ACTS.map(a=>`<button class="act" style="background:${a.col}" data-a="${a.id}"><span class="ico">${a.ico}</span><span>${a.t}<span class="sub">${a.s}</span></span></button>`).join("")}</div>
  </div>
  <div class="panel">
    <p class="label">🏅 My stickers <span class="sub">${toNext} ⭐ to the next sticker</span></p>
    <div class="shelf">${STICKERS.map((s,i)=>`<span class="${i<unlocked?'':'locked'}">${s}</span>`).join("")}</div>
  </div>`;
  app.querySelectorAll(".topic").forEach(b=>b.onclick=()=>{state.topic=b.dataset.t; save(); menu();});
  app.querySelectorAll(".act").forEach(b=>b.onclick=()=>GAMES[b.dataset.a]());
}

/* ============ SHELL ============ */
function shell(title, sub, total){
  app.innerHTML = `
  <div class="topbar">
    <button class="back" id="back">← Menu</button>
    <div class="bar"><i style="width:0%"></i></div>
    <div class="stars">⭐ <span id="starCount">${state.stars}</span></div>
  </div>
  <div class="task">${title}<span class="sub">${sub}</span></div>
  <div class="stage" id="stage"></div>`;
  document.getElementById("back").onclick = ()=>{ try{speechSynthesis.cancel();}catch(e){} menu(); };
  return document.getElementById("stage");
}
function setBar(done,total){ const i=app.querySelector(".bar i"); if(i) i.style.width = Math.round(done/total*100)+"%"; }

function finish(gameFn, earned, newSticker){
  confetti();
  const st = newSticker ? STICKERS[Math.min(STICKERS.length,Math.floor(state.stars/STARS_PER_STICKER))-1] : null;
  app.innerHTML = `
  <div class="topbar"><button class="back" id="back">← Menu</button><div style="flex:1"></div><div class="stars">⭐ <span id="starCount">${state.stars}</span></div></div>
  <div class="stage end">
    <div class="big">🏆</div>
    <h2>${rnd(PRAISE)}</h2>
    <div style="font-size:24px;font-weight:800">You got ${earned} ⭐</div>
    ${st?`<div class="newsticker">¡Nueva pegatina! New sticker!<span>${st}</span></div>`:""}
    <div class="opts" style="margin-top:22px">
      <button class="next" id="again">🔁 Otra vez</button>
      <button class="next" id="tomenu" style="background:var(--green);box-shadow:0 4px 0 #1f8a5d">🏠 Menu</button>
    </div>
  </div>`;
  document.getElementById("back").onclick = menu;
  document.getElementById("tomenu").onclick = menu;
  document.getElementById("again").onclick = gameFn;
  say(st ? "¡Nueva pegatina!" : "¡Muy bien!");
}
function confetti(){
  const e=["⭐","🎉","✨","🌟","🎊"];
  for(let i=0;i<26;i++){ const s=document.createElement("div"); s.className="confetti"; s.textContent=rnd(e); s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.6+Math.random()*1.8)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3600); }
}

function runQuestions(gameFn, title, sub, qs, renderQ){
  let i=0, earned=0, sticker=false;
  const stage = shell(title, sub, qs.length);
  const next = () => {
    if(i>=qs.length){ finish(gameFn, earned, sticker); return; }
    setBar(i, qs.length);
    renderQ(stage, qs[i], (firstTry)=>{ if(firstTry){ earned++; if(addStar()) sticker=true; } i++; setTimeout(next, 1300); });
  };
  next();
}
function wrong(b, stage, msg){ b.classList.add("bad"); setTimeout(()=>{b.classList.remove("bad");b.classList.add("faded");},400); stage.querySelector("#fb").textContent=msg||"¡Otra vez! Try again 🙂"; }

/* ============ GAMES ============ */
const GAMES = {};

GAMES.match = function(){
  const set = shuffle(items()).slice(0,6);
  const stage = shell("Match it", "Click a meaning, then the Spanish word", set.length);
  const pics = shuffle(set), words = shuffle(set);
  stage.innerHTML = `<div class="match">
    <div class="col">${pics.map(([w,p])=>`<button class="tile pic" data-w="${esc(w)}">${picHTML(p,46)}</button>`).join("")}</div>
    <div class="col">${words.map(([w])=>`<button class="tile wd" data-w="${esc(w)}">${w}</button>`).join("")}</div>
  </div><div class="feedback" id="fb"></div>`;
  let selPic=null, selWord=null, matched=0, earned=0, sticker=false, misses=0;
  const fb = stage.querySelector("#fb");
  const check = () => {
    if(!selPic||!selWord) return;
    if(selPic.dataset.w===selWord.dataset.w){
      [selPic,selWord].forEach(t=>{t.classList.remove("sel");t.classList.add("ok");t.disabled=true;});
      say(selWord.dataset.w); matched++; setBar(matched,set.length);
      if(misses===0){ earned++; if(addStar()) sticker=true; }
      misses=0; fb.textContent = rnd(PRAISE);
      if(matched===set.length) setTimeout(()=>finish(GAMES.match,earned,sticker),1300);
    } else {
      misses++; [selPic,selWord].forEach(t=>{t.classList.remove("sel");t.classList.add("bad");setTimeout(()=>t.classList.remove("bad"),450);});
      fb.textContent = "¡Otra vez! Try again 🙂";
    }
    selPic=selWord=null;
  };
  stage.querySelectorAll(".tile.pic").forEach(t=>t.onclick=()=>{ stage.querySelectorAll(".tile.pic").forEach(x=>x.classList.remove("sel")); selPic=t; t.classList.add("sel"); check(); });
  stage.querySelectorAll(".tile.wd").forEach(t=>t.onclick=()=>{ stage.querySelectorAll(".tile.wd").forEach(x=>x.classList.remove("sel")); selWord=t; t.classList.add("sel"); check(); });
};

GAMES.choose = function(){
  const qs = shuffle(items()).slice(0,8);
  runQuestions(GAMES.choose, "¿Qué es?", "Choose the right Spanish word", qs, (stage,[w,p],done)=>{
    const opts = shuffle([w, ...shuffle(items().filter(x=>x[0]!==w)).slice(0,2).map(x=>x[0])]);
    stage.innerHTML = `<div class="bigpic">${picHTML(p)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    let first=true;
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===w){ b.classList.add("ok"); stage.querySelectorAll(".opt").forEach(x=>x.disabled=true); say(w); stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); }
      else { first=false; wrong(b,stage); }
    });
  });
};

GAMES.listen = function(){
  const qs = shuffle(items()).slice(0,8);
  runQuestions(GAMES.listen, "Escucha", "Listen and click the right meaning", qs, (stage,[w,p],done)=>{
    const opts = shuffle([[w,p], ...shuffle(items().filter(x=>x[0]!==w)).slice(0,3)]);
    stage.innerHTML = `
      ${canSpeak?`<button class="speak" id="play" style="font-size:32px;padding:12px 28px">🔊 Escucha</button>`:""}
      <div id="showw" style="font-size:40px;font-weight:900;margin-top:8px;${canSpeak?'visibility:hidden':''}">${w}</div>
      ${canSpeak?`<button class="hint" id="showbtn">👀 Show the word</button>`:""}
      <div class="pics">${opts.map(([ow,op])=>`<button class="picbtn" data-o="${esc(ow)}">${picHTML(op,80)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    let first=true;
    if(canSpeak){ stage.querySelector("#play").onclick=()=>say(w); stage.querySelector("#showbtn").onclick=()=>{first=false; stage.querySelector("#showw").style.visibility="visible";}; setTimeout(()=>say(w),350); }
    stage.querySelectorAll(".picbtn").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===w){ b.classList.add("ok"); stage.querySelectorAll(".picbtn").forEach(x=>x.disabled=true); stage.querySelector("#showw").style.visibility="visible"; stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); }
      else { first=false; wrong(b,stage,"¡Escucha otra vez! Listen again 👂"); }
    });
  });
};

GAMES.spell = function(){
  const strip = w => w.replace(/^(el|la|los|las) /,"");
  const pool = items().map(([w,p])=>[strip(w),p,w]).filter(([w])=>/^[a-záéíóúñü]+$/i.test(w) && w.length<=10);
  const qs = shuffle(pool).slice(0,6);
  runQuestions(GAMES.spell, "Spell it", "Click the letters in the right order (watch the accents: á é í ó ú ñ)", qs, (stage,[w,p,full],done)=>{
    const letters = shuffle(w.split(""));
    stage.innerHTML = `<div class="bigpic">${picHTML(p)}</div>
      ${full!==w?`<div class="gloss">${full.split(" ")[0]} …</div>`:""}
      <div class="slots">${w.split("").map(()=>`<div class="slot"></div>`).join("")}</div>
      <div class="tiles">${letters.map(l=>`<button class="letter" data-l="${l}">${l}</button>`).join("")}</div>
      <button class="hint" id="hint">💡 Help</button>
      <div class="feedback" id="fb"></div>`;
    let pos=0, first=true;
    const slots = stage.querySelectorAll(".slot");
    stage.querySelector("#hint").onclick=()=>{ first=false; say(full); const fb=stage.querySelector("#fb"); fb.textContent=w; setTimeout(()=>{ if(pos<w.length) fb.textContent=""; },1800); };
    stage.querySelectorAll(".letter").forEach(b=>b.onclick=()=>{
      if(b.dataset.l===w[pos]){ slots[pos].textContent=w[pos]; slots[pos].classList.add("filled"); b.classList.add("used"); pos++;
        if(pos===w.length){ say(full); stage.querySelector("#fb").textContent=rnd(PRAISE)+" "+full; done(first); } }
      else { first=false; b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),400); }
    });
  });
};

GAMES.memory = function(){
  const set = shuffle(items()).slice(0,6);
  const stage = shell("Memory", "Find the Spanish word and its meaning", set.length);
  const cards = shuffle([...set.map(([w,p])=>({w,p,type:"pic"})), ...set.map(([w])=>({w,type:"word"}))]);
  stage.innerHTML = `<div class="mem">${cards.map((c,i)=>`<button class="card" data-i="${i}">?</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  let open=[], found=0, lock=false, tries=0;
  const els = stage.querySelectorAll(".card");
  const show = (i)=>{ const c=cards[i], el=els[i]; el.classList.add("open"); if(c.type==="word"){el.classList.add("w"); el.textContent=c.w;} else el.innerHTML=picHTML(c.p,52); };
  const hide = (i)=>{ const el=els[i]; el.classList.remove("open","w"); el.textContent="?"; };
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i; if(lock||open.includes(i)||el.classList.contains("done")) return;
    show(i); open.push(i);
    if(open.length===2){
      const [a,b]=open; tries++;
      if(cards[a].w===cards[b].w && cards[a].type!==cards[b].type){
        els[a].classList.add("done"); els[b].classList.add("done"); say(cards[a].w); found++; setBar(found,set.length); open=[];
        stage.querySelector("#fb").textContent=rnd(PRAISE);
        if(found===set.length){ const earned = tries<=10?6:tries<=14?5:4; let st=false; for(let k=0;k<earned;k++) if(addStar()) st=true; setTimeout(()=>finish(GAMES.memory,earned,st),1300); }
      } else { lock=true; setTimeout(()=>{hide(a);hide(b);open=[];lock=false;},1100); }
    }
  });
};

GAMES.sentence = function(){
  const qs = shuffle(SENTENCES).slice(0,6);
  runQuestions(GAMES.sentence, "Make a sentence", "Click the words in the right order", qs, (stage,[s,p],done)=>{
    const words = s.split(" ");
    const tiles = shuffle(words);
    stage.innerHTML = `<div class="bigpic" style="font-size:90px;min-height:110px">${picHTML(p,90)}</div>
      <div class="slots">${words.map(()=>`<div class="slot wslot"></div>`).join("")}</div>
      <div class="tiles">${tiles.map(t=>`<button class="word" data-w="${esc(t)}">${t}</button>`).join("")}</div>
      <button class="hint" id="hint">💡 Help</button>
      <div class="feedback" id="fb"></div>`;
    let pos=0, first=true;
    const slots = stage.querySelectorAll(".slot");
    stage.querySelector("#hint").onclick=()=>{ first=false; say(s); const btn=[...stage.querySelectorAll(".word")].find(b=>!b.classList.contains("used")&&b.dataset.w===words[pos]); if(btn){btn.classList.add("ok"); setTimeout(()=>btn.classList.remove("ok"),900);} };
    stage.querySelectorAll(".word").forEach(b=>b.onclick=()=>{
      if(b.dataset.w===words[pos]){ slots[pos].textContent=words[pos]; slots[pos].classList.add("filled"); b.classList.add("used"); pos++;
        if(pos===words.length){ say(s); stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); } }
      else { first=false; b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),400); }
    });
  });
};

GAMES.gap = function(){
  const qs = shuffle(GAPS).slice(0,8);
  runQuestions(GAMES.gap, "Fill the gap", "Choose the word that completes the sentence", qs, (stage,[s,opts,ans,p,en],done)=>{
    stage.innerHTML = `<div class="bigpic" style="font-size:80px;min-height:100px">${p}</div>
      <div class="gapline" id="line">${s.replace("___","<b>&nbsp;?&nbsp;</b>")}</div>
      <div class="gloss">EN: ${esc(en)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    let first=true;
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===ans){ b.classList.add("ok"); stage.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        stage.querySelector("#line").innerHTML = s.replace("___",`<b>${ans}</b>`); say(s.replace("___",ans)); stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); }
      else { first=false; wrong(b,stage); }
    });
  });
};

GAMES.qa = function(){
  const qs = shuffle(QA).slice(0,8);
  runQuestions(GAMES.qa, "Question & answer", "Read (or listen to) the question and choose the best answer", qs, (stage,[q,a],done)=>{
    const opts = shuffle([a, ...shuffle(QA.filter(x=>x[1]!==a)).slice(0,2).map(x=>x[1])]);
    stage.innerHTML = `<div class="question">💬 ${q}</div>
      ${canSpeak?`<button class="speak" id="play">🔊</button>`:""}
      <div class="opts" style="flex-direction:column;align-items:center">${opts.map(o=>`<button class="opt long" data-o="${esc(o)}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    if(canSpeak) stage.querySelector("#play").onclick=()=>say(q);
    let first=true;
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===a){ b.classList.add("ok"); stage.querySelectorAll(".opt").forEach(x=>x.disabled=true); say(q+" "+a); stage.querySelector("#fb").textContent=rnd(PRAISE); done(first); }
      else { first=false; wrong(b,stage); }
    });
  });
};

menu();
</script>
